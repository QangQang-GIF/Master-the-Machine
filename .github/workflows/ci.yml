name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      require_live_gates:
        description: "Strictly require live Staging GM & CLI credentials (fail if missing)"
        required: false
        default: false
        type: boolean

jobs:
  test-core:
    name: Core Unit & Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest

    - name: Verify Skill Checksums
      run: |
        python -c "from mtm_core.config.loader import verify_skill_checksums; verify_skill_checksums('.')"

    - name: Run Core Test Suite
      run: |
        pytest tests --ignore=tests/e2e -v

  test-e2e-simulation:
    name: E2E Simulation Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest

    - name: Run E2E Component & Tournament Simulation (Strict: Zero Skips)
      run: |
        pytest tests/e2e/test_e2e_a_components.py tests/e2e/test_e2e_b_tournament_sim.py -v --junitxml=e2e_sim_results.xml
        python -c "import xml.etree.ElementTree as ET, sys; root = ET.parse('e2e_sim_results.xml').getroot(); suite = root.find('testsuite') or root; skipped = int(suite.attrib.get('skipped', 0)); tests = int(suite.attrib.get('tests', 0)); failed = int(suite.attrib.get('failures', 0)); errors = int(suite.attrib.get('errors', 0)); sys.exit(1 if (skipped > 0 or tests == 0 or failed > 0 or errors > 0) else 0)"

    - name: Run E2E Production Target Safety Check
      run: |
        pytest tests/e2e/test_e2e_d_staging_gm.py -k "test_e2e_d_staging_safe_target_verification" -v

  staging-release-gate:
    name: Game Master Staging Live Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest

    - name: Check Staging Credentials Availability
      id: check-creds
      env:
        STAGING_URL: ${{ secrets.MTM_GM_STAGING_URL }}
        STAGING_TOKEN: ${{ secrets.MTM_GM_TOKEN }}
        REQUIRE_LIVE: ${{ inputs.require_live_gates }}
      run: |
        if [ -n "$STAGING_URL" ] && [ -n "$STAGING_TOKEN" ]; then
          echo "has_creds=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$STAGING_URL" ] && [ -z "$STAGING_TOKEN" ]; then
          echo "::error ::MTM_GM_STAGING_URL is set but MTM_GM_TOKEN is missing. Both are required for staging gate."
          exit 1
        elif [ -z "$STAGING_URL" ] && [ -n "$STAGING_TOKEN" ]; then
          echo "::error ::MTM_GM_TOKEN is set but MTM_GM_STAGING_URL is missing. Both are required for staging gate."
          exit 1
        elif [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$REQUIRE_LIVE" = "true" ]; then
          echo "::error ::Official release gate requires both MTM_GM_STAGING_URL and MTM_GM_TOKEN secrets to be configured."
          exit 1
        else
          echo "has_creds=false" >> "$GITHUB_OUTPUT"
          echo "::notice ::Staging Game Master credentials not configured. Gate deferred to pre-tournament release checklist."
        fi

    - name: Run Live Staging Integration (Strict: Zero Skips Allowed)
      if: steps.check-creds.outputs.has_creds == 'true'
      env:
        MTM_GM_STAGING_URL: ${{ secrets.MTM_GM_STAGING_URL }}
        MTM_GM_TOKEN: ${{ secrets.MTM_GM_TOKEN }}
        MTM_STAGING_GM: "1"
      run: |
        pytest tests/e2e/test_e2e_d_staging_gm.py -m staging_game_master -v --junitxml=staging_results.xml
        python -c "import xml.etree.ElementTree as ET, sys; root = ET.parse('staging_results.xml').getroot(); suite = root.find('testsuite') or root; skipped = int(suite.attrib.get('skipped', 0)); tests = int(suite.attrib.get('tests', 0)); failed = int(suite.attrib.get('failures', 0)); errors = int(suite.attrib.get('errors', 0)); print(f'Executed: {tests}, Skipped: {skipped}, Failed: {failed}, Errors: {errors}'); sys.exit(1 if (skipped > 0 or tests == 0 or failed > 0 or errors > 0) else 0)"
