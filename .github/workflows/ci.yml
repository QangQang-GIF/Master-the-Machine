name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-core:
    name: Core Unit & Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest

    - name: Verify Skill Checksums
      run: |
        python -c "from mtm_core.config.loader import verify_skill_checksums; verify_skill_checksums('.')"

    - name: Run Core Test Suite
      run: |
        pytest tests --ignore=tests/e2e -v

  test-e2e-simulation:
    name: E2E Simulation Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest

    - name: Run E2E Component & Tournament Simulation (No Skips)
      run: |
        pytest tests/e2e/test_e2e_a_components.py tests/e2e/test_e2e_b_tournament_sim.py -v

    - name: Run E2E Production Target Safety Check
      run: |
        pytest tests/e2e/test_e2e_d_staging_gm.py -k "test_e2e_d_staging_safe_target_verification" -v

  staging-release-gate:
    name: Game Master Staging Live Gate
    runs-on: ubuntu-latest
    if: "${{ env.MTM_GM_STAGING_URL != '' }}"
    env:
      MTM_GM_STAGING_URL: ${{ secrets.MTM_GM_STAGING_URL }}
      MTM_GM_TOKEN: ${{ secrets.MTM_GM_TOKEN }}
      MTM_STAGING_GM: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest
    - name: Run Live Staging Integration (Strict: No Skips Allowed)
      run: |
        pytest tests/e2e/test_e2e_d_staging_gm.py -m staging_game_master -v
