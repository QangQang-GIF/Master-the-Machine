mode: development
supervisor: antigravity_or_codex_desktop
orchestrator:
  worker_backend: antigravity

worker:
  strict_backend: true
  allow_fallback: false

skills:
  registry_dir: .agents/skills
  mutable: true
  allow_evolution: true
runtime:
  default_timeout_seconds: 420
  concurrency_limit: 2
  log_level: DEBUG
  trace_logging: true
benchmarks:
  record_traces: true
  enable_ab_testing: true
