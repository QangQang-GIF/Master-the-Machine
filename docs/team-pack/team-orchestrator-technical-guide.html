gress-node>text:not(.small){fill:#ffe38a}.node.progress-node .small{fill:#f4dda1}.edge path{fill:none;stroke:#4dd9ee;stroke-width:2;marker-end:url(#arrow)}.labels text{font-size:12px;fill:#96c9d7;text-anchor:middle}.sequence{min-width:1130px}.lane{stroke:#355564;stroke-dasharray:5 5}.lane-title{fill:#b9cfda;font-size:17px;text-anchor:middle;font-weight:750}.lane-title.entity-orch{fill:var(--entity-orch)}.lane-title.entity-player{fill:var(--entity-player)}.lane-title.entity-server{fill:var(--entity-server)}.seq-bg{fill:#0f202c;stroke:#223a48;opacity:.95}.seq-num{fill:#7db8c9;font-size:12px}.seq-label{fill:#eaf6fc;font-size:14px;font-weight:600}.seq-sub{fill:#a6c5d4;font-size:11.5px}.seq-edge{fill:none;stroke:#4dd9ee;stroke-width:1.7;marker-end:url(#seq-arrow)}.pill{color:#ffd56a;font-weight:800}.smallprint{font-size:13px;color:var(--muted)}.environment-note{max-width:1000px;margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--entity-player);border-radius:6px;background:#102b42;color:#cceaff;font-size:14px}.prank-note{max-width:900px;margin:16px auto 0;padding:10px 14px;text-align:center;border:1px solid #9f7b1f;border-left:4px solid var(--yellow);border-radius:8px;background:#332b14;color:#ffe9a8;font-size:14px}.prank-note .emoji{display:inline-block;margin-right:7px;font-size:18px;transform:rotate(-6deg)}.guide-actions{position:absolute;top:10px;right:24px;display:flex;align-items:center}.language-switch{position:static;display:flex;gap:4px;border:1px solid #3c687d;border-radius:8px;padding:3px}.language-switch a,.language-switch span{display:inline-block;padding:2px 8px;border-radius:5px;text-decoration:none;font-size:12px;line-height:18px;font-weight:700}.language-switch .selected{background:#14627a;color:#fff}.language-switch a{color:#a9d8e5}.print{background:#153548;border:1px solid #3c687d;color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}@media(max-width:900px){.layout{display:block}nav{position:static;display:flex;overflow:auto;margin-bottom:20px}nav a{min-width:170px}header{padding:24px}h2{font-size:24px}}@media print{body{background:white;color:#111}nav,.copy,.print{display:none}.layout{display:block}header{background:white;padding:0}details,section,.step{break-inside:auto}pre{white-space:pre-wrap;max-height:none;color:#111;background:#f0f3f5}.diagram{background:#10202d;break-inside:avoid}.card,.step{background:white;color:#111}aside{background:#fff4ce}table{font-size:11px}.step p,header p{color:#333}}.language-switch button{display:inline-block;padding:2px 8px;border:0;border-radius:5px;background:transparent;color:#a9d8e5;font:inherit;font-size:12px;line-height:18px;font-weight:700;cursor:pointer}.language-switch button.selected{background:#14627a;color:#fff}</style></head><body><div id="guide-root"></div><template id="guide-en"><header><div class="eyebrow">MASTER THE MACHINE · CONTESTANT GUIDE</div><h1>Build a Team Orchestrator for MTM</h1><p class="guide-version" data-guide-version="0.5.1">Guide version: <strong>0.5.1</strong></p><p class="environment-note"><strong>Note:</strong> The current system can support both Codex and Claude Code. However, to provide a consistent and fair environment for competing Team Orchestrators, the organizers have selected Codex as the official competition environment. Therefore, please do not ask whether Claude Code can be used in the competition.</p><div class="prank-note"><span class="emoji" aria-hidden="true">🤪</span><strong>Warning:</strong> Do not trust everything in this guide—we, the organizers, may be deliberately trying to confuse you.</div><div class="guide-actions"><nav class="language-switch" aria-label="Language"><button type="button" data-language="vi">Tiếng Việt</button><button type="button" data-language="en" class="selected" aria-current="page">English</button></nav></div></header><div class="layout"><nav aria-label="Contents"><a href="#section-1">1. Game model</a><a href="#section-2">2. Orchestrator structure</a><a href="#section-3">3. Sequence & data</a><a href="#section-4">4. Guardrails & violations</a><a href="#section-5">5. Package the team pack</a></nav><main><section id="section-1"><h2>1. Game model</h2><div class="diagram"><svg viewBox="0 0 1080 330" role="img" aria-label="Connections between mtm-game-server, Player, orchestrator, Git, and the progress log"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4dd9ee"/></marker></defs><g class="node entity-player"><rect x="15" y="110" width="220" height="100"/><text x="125" y="150">mtm-player</text><text class="small" x="125" y="178">Launch • monitor • approvals</text></g><g class="node entity-orch"><rect x="390" y="110" width="250" height="100"/><text x="515" y="150">TEAM ORCHESTRATOR</text><text class="small" x="515" y="178">Prepare • code • test • submit</text></g><g class="node entity-server"><rect x="810" y="15" width="250" height="95"/><text x="935" y="54">mtm-game-server</text><text class="small" x="935" y="81">Tasks • time • status • receipt</text></g><g class="node"><rect x="810" y="210" width="250" height="95"/><text x="935" y="250">ASSIGNED GIT</text><text class="small" x="935" y="278">Source • branch • revision</text></g><g class="edge"><path d="M235 140 H390"/><path d="M640 140 L810 80"/><path d="M640 180 L810 240"/><path d="M125 110 V62 H810"/><path d="M515 210 V280 H125 V210"/></g><g class="labels"><text x="312" y="124">Input / start / stop</text><text x="720" y="93">Login • backlog • submit</text><text x="720" y="231">Checkout • commit • push</text><text x="420" y="49">mtm-player: team info • preparation complete • match status</text><text x="320" y="302">Orchestrator → progress.ndjson → mtm-player dashboard</text></g></svg></div><div class="table-wrap"><table><thead><tr><th>Component</th><th>Role</th><th>Main inputs and outputs</th></tr></thead><tbody><tr><td>mtm-game-server</td><td>Provides the match, backlog, and assignment; manages time and status; receives submissions and returns receipts. Official grading and scores come from the organizer's system.</td><td>Account and session cookie for the match view; team bearer token for Start Work and Submit. Returns match, team, repository, backlog, operation endpoints, and receipts.</td></tr><tr><td>mtm-player</td><td>mtm-player initializes and checks the pack, runs the CLI and Team Orchestrator Agent, supplies phase-specific access, reads readiness, tracks match status, and handles stop, resume, approvals, and the dashboard.</td><td>Operator input: workspace, team, match, server access, and model/approval choices. Output to the Team Orchestrator Agent: preparation, game, control, and recovery data.</td></tr><tr><td>Team Orchestrator</td><td>Team-owned system: prepares source, reads the backlog, chooses work order, implements and tests, commits and pushes, calls Start Work and Submit, and reports progress.</td><td>Receives data from mtm-player and public tasks from the server; reports readiness and appends progress events. May use internal workers.</td></tr><tr><td>Assigned Git</td><td>Assigned source, branch, and folder; immutable revision for submission.</td><td>The Team Orchestrator Agent checks out, commits, and pushes within the assigned scope.</td></tr><tr><td>Progress NDJSON</td><td>Business status channel used by mtm-player to display preparation, backlog, tests, blockers, and API activity.</td><td>The team helper or Team Orchestrator Agent appends; mtm-player reads. Transcript text does not replace the log.</td></tr></tbody></table></div><aside>mtm-game-server decides match status and acceptance. The progress log reports team status, and the transcript does not replace mandatory logs.</aside></section><section id="section-2"><h2>2. Suggested orchestrator structure</h2><p>The diagram proposes a Team Orchestrator acting as Project Manager with four specialist agents. The agents folder in the example pack follows the same structure: each TOML file has the corresponding agent name and a description. This is a reference structure; the registrations accepted by mtm-player may depend on its version. MCP Helper and Progress NDJSON are shared runtime components.</p><div class="diagram"><svg viewBox="0 0 1100 560" role="img" aria-label="Team Orchestrator, four specialist agents, MCP Helper, and Progress NDJSON"><g class="node entity-orch"><rect x="365" y="20" width="370" height="92"/><text x="550" y="57">TEAM ORCHESTRATOR</text><text class="small" x="550" y="83">Project Manager • coordinate • make final decisions</text></g><g class="node entity-orch"><rect x="20" y="180" width="235" height="88"/><text x="137" y="214">BUSINESS ANALYST</text><text class="small" x="137" y="240">Requirements • acceptance criteria</text></g><g class="node entity-orch"><rect x="285" y="180" width="235" height="88"/><text x="402" y="214">DEVELOPER</text><text class="small" x="402" y="240">Design • code • integration</text></g><g class="node entity-orch"><rect x="550" y="180" width="235" height="88"/><text x="667" y="214">CYBER SECURITY</text><text class="small" x="667" y="240">Guardrails • secrets • scope</text></g><g class="node entity-orch"><rect x="815" y="180" width="265" height="88"/><text x="947" y="214">TESTER</text><text class="small" x="947" y="240">Test • regression • evidence</text></g><g class="node"><rect x="175" y="370" width="330" height="100"/><text x="340" y="406">MCP HELPER — NODE.JS</text><text class="small" x="340" y="432">Session • Game API • retry</text><text class="small" x="340" y="452">Credential-safe runtime</text></g><g class="node progress-node"><rect x="595" y="370" width="330" height="100"/><text x="760" y="406">PROGRESS NDJSON</text><text class="small" x="760" y="432">Readiness • backlog • tests • blockers</text><text class="small" x="760" y="452">mtm-player reads this file</text></g><g class="edge"><path d="M550 112 V145 H137 V180"/><path d="M550 145 H402 V180"/><path d="M550 145 H667 V180"/><path d="M550 145 H947 V180"/><path d="M137 268 V320 H340 V370"/><path d="M402 268 V320 H340"/><path d="M667 268 V320 H340"/><path d="M947 268 V320 H340"/><path d="M505 420 H595"/><path d="M550 112 V340 H760 V370"/></g><g class="labels"><text x="550" y="138">spawn • assign • review • consolidate</text><text x="550" y="350">tools/call</text><text x="550" y="408">append</text><text x="550" y="520">Without a complete and valid progress log, mtm-player cannot accurately track the team's status</text></g></svg></div><aside class="must-not-box"><span class="must-not">MUST NOT</span> — The Team Orchestrator may spawn subagents only through the provider's native mechanism within the active CLI session. It must not launch additional Codex CLI, Claude Code CLI, app-server, or other independent CLI processes to perform match work.</aside><div class="table-wrap"><table><thead><tr><th>Module</th><th>Responsibility</th></tr></thead><tbody><tr><td>Team Orchestrator Agent</td><td>Acts as Project Manager: receives lifecycle input, selects backlog work, assigns tasks, reviews results, integrates changes, and owns the final decision.</td></tr><tr><td>Business Analyst</td><td>Reads the backlog and clarifies requirements, acceptance criteria, constraints, and inputs for the Developer and Tester.</td></tr><tr><td>Developer</td><td>Explores the source, designs and implements changes, runs technical checks, and prepares the commit.</td></tr><tr><td>Cyber Security</td><td>Checks guardrails, workspace and network scope, credential handling, and actions that may cause violations.</td></tr><tr><td>Tester</td><td>Derives test scenarios from acceptance criteria, runs regression tests, and verifies results and evidence before submission.</td></tr><tr><td>MCP Helper — Node.js</td><td>Shared runtime for the session, in-memory cookie and bearer token, Game API, retry and idempotency, and progress-log appends. Agents call the helper instead of holding credentials or issuing HTTP requests themselves.</td></tr><tr><td>Progress NDJSON</td><td>Mandatory status file used by mtm-player to read readiness, backlog, tests, blockers, and API activity. MCP Helper appends one JSON object per line to the exact progressLogFile; the transcript does not replace this file.</td></tr></tbody></table></div><h3>Agent declaration structure</h3><p>The following structure example corresponds to the Developer role in the diagram and uses the file <code>agents/team_developer.toml</code>.</p><details><summary>agents/team_developer.toml — structure example</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="toml">name = &quot;team_developer&quot;
description = &quot;Developer agent profile.&quot;</code></pre></div></details><p>The value of <code>name</code> must match the agent name in the filename (excluding the <code>.toml</code>extension). These profile files show declaration structure only; they contain no instructions or implementation source.</p><details><summary>Source package and installed workspace folder layout</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="text">team-orchestrator-pack-example/
  package.json
  team-pack-info.json
  team-runtime.json
  logs/MATCH_ID.progress.ndjson # empty file; replace MATCH_ID with the actual matchId
  README.md
  install.ps1
  agents/                      # root + four roles from section 2
    team-orchestrator.toml
    team-business-analyst.toml
    team-developer.toml
    team-cyber-security.toml
    team-tester.toml
  config/codex.toml
  skills/                      # instruction structure
    team-orchestrator/SKILL.md
    game-preparation/SKILL.md
    team-recovery/SKILL.md
  bin/runtime-server.mjs       # MCP Helper
  src/runtime-session.mjs
  contracts/progress-event.schema.json
  docs/README.md
  scripts/install.mjs
  scripts/check-distribution.mjs

The five agent files show the suggested structure in section 2. Each file contains only a matching name and description. This is an illustrative role structure; mtm-player registration compatibility depends on the installed mtm-player version. MCP Helper and Progress NDJSON are shared runtime components, not agent profiles.

After installation: &lt;teamWorkspace&gt;/
  matches/
    &lt;matchId&gt;/             # checkoutRoot: Git checkout, contains .git/
      &lt;repository.folder&gt;/ # matchRoot: assigned match subtree
        src/
        challenge/
        answers/
          &lt;backlogId&gt;/
            submit.json
            evidence/
  team-sdlc-pack/runtime/     # immutable payload
  team-sdlc-pack/logs/        # separate logs for each round/session
  .mtm/                      # team-runtime.json, team-pack-info.json
  .codex/agents/             # profile copies
  .codex/config.toml         # absolute MCP path
  .agents/skills/            # skill copies</code></pre></div><h4>team-pack-info.json — required file with a fixed structure</h4><p>MUST create this file at the package root. Keep exactly the four fields shown; do not rename or add fields. schemaVersion remains 1. Set teamId and teamName to the code and name registered on mtm-game-server; teamId is not a UUID. Set version to the package version, matching package.json and team-runtime.json.</p><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
  &quot;version&quot;: &quot;1.0.0&quot;,
  &quot;teamId&quot;: &quot;HNKSUPER&quot;,
  &quot;teamName&quot;: &quot;HNK Super&quot;
}</code></pre></div><p>The example is HNKSUPER's identity. Other teams MUST replace it before building. The installer copies the file to team-sdlc-pack/runtime/team-pack-info.json and .mtm/team-pack-info.json in TeamWorkspace. mtm-player reads this identity when loading the team pack; both copies MUST match. See <a href="#section-5">section 5</a> for character limits and naming rules.</p></details><h3>Checkout root and match root</h3><p>Use the absolute paths supplied by mtm-player. <code>checkoutRoot</code> contains the Git checkout and <code>.git/</code>. <code>matchRoot = checkoutRoot/repository.folder</code> contains the assigned source, public challenge files, answers, and evidence. The repeated match ID in the example is intentional: the outer directory identifies the local checkout, and the inner directory comes from the server repository assignment.</p><p>Clone into <code>checkoutRoot</code>; build, test, and write answers inside <code>matchRoot</code>. A specialist worktree uses its own <code>worktreeRoot/repository.folder</code> as matchRoot. Pass both paths to the specialist. The compatibility field <code>challengeWorkspace</code> may point to <code>matches/</code>; use the explicit roots rather than treating that field as the source folder. Do not edit sibling match folders. Init/reset applies only to the selected match checkout; existing matches remain available. Resume uses the saved paths and preserves completed work.</p><h3>Helper tools to implement</h3><div class="table-wrap"><table><thead><tr><th>Suggested tool</th><th>Input</th><th>Output and behavior</th></tr></thead><tbody><tr><td>configure_session</td><td>descriptor, modelPolicy if present</td><td>Validate session and paths; preparation derives paths from trusted cwd; start retains the verified match session and repository while replacing the bearer client; resume replaces access from fresh input.</td></tr><tr><td>login_match</td><td>{}</td><td>Authenticate the cookie session; return only a safe status.</td></tr><tr><td>refresh_match</td><td>{}</td><td>Current match view; verify identity and repository; emit DISCOVERED for new items only during active play.</td></tr><tr><td>start_work</td><td>backlogItemKey</td><td>Return public requirements, template, and scenarios; log before and after HTTP calls.</td></tr><tr><td>submit_work</td><td>clientSubmissionId, backlogItemKey, gitRevision, answer</td><td>Return the official receipt; keep the UUID unchanged when the outcome is uncertain.</td></tr><tr><td>report_progress</td><td>event without the envelope</td><td>Add schemaVersion and playerSessionId and append a schema-valid event.</td></tr><tr><td>wait_for_update</td><td>timeoutMs ≤ 55000</td><td>Bounded serial polling; return on a change or timeout; stop on control messages.</td></tr></tbody></table></div><p>Use newline-delimited JSON-RPC for MCP over stdin/stdout. Implement initialize, notifications/initialized, tools/list, and tools/call. Each tool in tools/list needs an inputSchema. Write only JSON-RPC to stdout; tool output is safe JSON in a text content block. Bound request time, response size, redirects, and origins.</p></section><section id="section-3"><h2>3. From spawn to match end</h2><aside>MUST log GAME_MASTER_API REQUESTED immediately before <em>every</em> login, refresh, Start Work, and Submit request; log SUCCEEDED or FAILED immediately after the result, including errors. The sequence names actions and data; the steps below detail inputs and outputs.</aside><div class="diagram"><svg viewBox="0 0 1190 2014" class="sequence" role="img" aria-label="Sequence from orchestrator startup to match end and resume"><defs><marker id="seq-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4dd9ee"/></marker></defs><text class="lane-title entity-player" x="95" y="28">mtm-player</text><line class="lane" x1="95" y1="43" x2="95" y2="2004"/><text class="lane-title entity-orch" x="340" y="28">Orchestrator</text><line class="lane" x1="340" y1="43" x2="340" y2="2004"/><text class="lane-title entity-server" x="620" y="28">mtm-game-server</text><line class="lane" x1="620" y1="43" x2="620" y2="2004"/><text class="lane-title " x="880" y="28">Assigned Git</text><line class="lane" x1="880" y1="43" x2="880" y2="2004"/><text class="lane-title " x="1080" y="28">Progress log</text><text class="seq-sub" x="1080" y="47" text-anchor="middle">&lt;matchId&gt;.progress.ndjson</text><line class="lane" x1="1080" y1="43" x2="1080" y2="2004"/><a href="#step-1"><g><text class="seq-num" x="10" y="68">1</text><rect class="seq-bg" x="30" y="50" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="69">mtm-player spawns a new Team Orchestrator Agent</text><text class="seq-sub" x="45" y="87">INPUT: team T01, match ABCD1234, repo/branch/folder, account, origins, model list</text><line class="seq-edge" x1="95" y1="104" x2="340" y2="104"/></g></a><a href="#step-1"><g><text class="seq-num" x="10" y="151">2</text><rect class="seq-bg" x="30" y="133" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="152">MUST: ORCHESTRATOR_STARTED</text><text class="seq-sub" x="45" y="170">OUTPUT log: schemaVersion=1, playerSessionId, type, summary</text><line class="seq-edge" x1="340" y1="187" x2="1080" y2="187"/></g></a><a href="#step-2"><g><text class="seq-num" x="10" y="234">3</text><rect class="seq-bg" x="30" y="216" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="235">Verify Git access → check out the assigned source</text><text class="seq-sub" x="45" y="253">INPUT: repository.url, branch=main, folder=ABCD1234; OUTPUT: full revision</text><line class="seq-edge" x1="340" y1="270" x2="880" y2="270"/></g></a><a href="#step-3"><g><text class="seq-num" x="10" y="317">4</text><rect class="seq-bg" x="30" y="299" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="318">Install dependencies → build → baseline checks</text><text class="seq-sub" x="45" y="336">MUST log PREPARATION_STATUS: GIT_AUTH / REPOSITORY / ENVIRONMENT / BUILD</text><path class="seq-edge" d="M340 351 h70 v9 h-70"/></g></a><a href="#step-4"><g><text class="seq-num" x="10" y="400">5</text><rect class="seq-bg" x="30" y="382" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="401">Log in at the mtm-game-server URL supplied by mtm-player</text><text class="seq-sub" x="45" y="419">INPUT: username + password from mtm-player; OUTPUT: successful login</text><line class="seq-edge" x1="340" y1="436" x2="620" y2="436"/></g></a><a href="#step-5"><g><text class="seq-num" x="10" y="483">6</text><rect class="seq-bg" x="30" y="465" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="484">Open https://ai-fest-five.vercel.app/match/ABCD1234</text><text class="seq-sub" x="45" y="502">INPUT: matchId from mtm-player; OUTPUT: page for the assigned match, team, repository, and backlog</text><line class="seq-edge" x1="340" y1="519" x2="620" y2="519"/></g></a><a href="#step-6"><g><text class="seq-num" x="10" y="566">7</text><rect class="seq-bg" x="30" y="548" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="567">MUST: MATCH_LOGIN completed + ENVIRONMENT_READY</text><text class="seq-sub" x="45" y="585">LOG: requestId, repo, revision, build=PASS, matchLogin=PASS</text><line class="seq-edge" x1="340" y1="602" x2="1080" y2="602"/></g></a><a href="#step-6"><g><text class="seq-num" x="10" y="649">8</text><rect class="seq-bg" x="30" y="631" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="650">Report environment readiness</text><text class="seq-sub" x="45" y="668">OUTPUT: status=ENVIRONMENT_READY, requestId, repository, revision, build, matchLogin</text><line class="seq-edge" x1="340" y1="685" x2="95" y2="685"/></g></a><a href="#step-7"><g><text class="seq-num" x="10" y="732">9</text><rect class="seq-bg" x="30" y="714" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="733">mtm-player sends Preparation Complete</text><text class="seq-sub" x="45" y="751">OUTPUT: PREPARED; mtm-player waits for official IN_PROGRESS status</text><line class="seq-edge" x1="95" y1="768" x2="620" y2="768"/></g></a><a href="#step-8"><g><text class="seq-num" x="10" y="815">10</text><rect class="seq-bg" x="30" y="797" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="816">mtm-player authorizes backlog work</text><text class="seq-sub" x="45" y="834">INPUT: bearer key + length/hash, API scopes/origins, paths, prepared revision</text><line class="seq-edge" x1="95" y1="851" x2="340" y2="851"/></g></a><a href="#step-9"><g><text class="seq-num" x="10" y="898">11</text><rect class="seq-bg" x="30" y="880" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="899">Read /match/ABCD1234 after login</text><text class="seq-sub" x="45" y="917">OUTPUT: current backlog and operation instructions displayed by mtm-game-server</text><line class="seq-edge" x1="340" y1="934" x2="620" y2="934"/></g></a><a href="#step-9"><g><text class="seq-num" x="10" y="981">12</text><rect class="seq-bg" x="30" y="963" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="982">MUST: BACKLOG_SYNC completed; DISCOVERED for each item</text><text class="seq-sub" x="45" y="1000">LOG: backlogId, title, status=DISCOVERED, revision=null, receiptId=null</text><line class="seq-edge" x1="340" y1="1017" x2="1080" y2="1017"/></g></a><a href="#step-10"><g><text class="seq-num" x="10" y="1064">13</text><rect class="seq-bg" x="30" y="1046" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1065">POST /api/v1/matches/&lt;UUID&gt;/backlogs/start</text><text class="seq-sub" x="45" y="1083">BODY: {backlogItemKey:&quot;TASK-01&quot;}; OUTPUT: source template/scenarios; Team Orchestrator materializes answers/&lt;ID&gt;/submit.json and evidence/</text><line class="seq-edge" x1="340" y1="1100" x2="620" y2="1100"/></g></a><a href="#step-11"><g><text class="seq-num" x="10" y="1147">14</text><rect class="seq-bg" x="30" y="1129" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1148">MUST: BACKLOG_STATUS IN_PROGRESS; BACKLOG_TESTS NOT_RUN</text><text class="seq-sub" x="45" y="1166">Log IN_PROGRESS only after Start Work is accepted</text><line class="seq-edge" x1="340" y1="1183" x2="1080" y2="1183"/></g></a><a href="#step-11"><g><text class="seq-num" x="10" y="1230">15</text><rect class="seq-bg" x="30" y="1212" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1231">Implement → run tests → complete the answer</text><text class="seq-sub" x="45" y="1249">MUST: tests RUNNING, then PASSED/FAILED; include required/executed/passed/failed/skipped</text><path class="seq-edge" d="M340 1264 h70 v9 h-70"/></g></a><a href="#step-12"><g><text class="seq-num" x="10" y="1313">16</text><rect class="seq-bg" x="30" y="1295" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1314">Commit and push to the assigned branch</text><text class="seq-sub" x="45" y="1332">OUTPUT: full pushed Git SHA; source/tests/evidence/answer in the same commit</text><line class="seq-edge" x1="340" y1="1349" x2="880" y2="1349"/></g></a><a href="#step-13"><g><text class="seq-num" x="10" y="1396">17</text><rect class="seq-bg" x="30" y="1378" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1397">POST /api/v1/matches/&lt;UUID&gt;/submissions</text><text class="seq-sub" x="45" y="1415">BODY: clientSubmissionId, backlogItemKey, gitRevision, answer; HEADER: Idempotency-Key</text><line class="seq-edge" x1="340" y1="1432" x2="620" y2="1432"/></g></a><a href="#step-14"><g><text class="seq-num" x="10" y="1479">18</text><rect class="seq-bg" x="30" y="1461" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1480">Server returns a receipt or error</text><text class="seq-sub" x="45" y="1498">Example OUTPUT: receiptId + status=RECEIVED; this does not mean grading has passed</text><line class="seq-edge" x1="620" y1="1515" x2="340" y2="1515"/></g></a><a href="#step-14"><g><text class="seq-num" x="10" y="1562">19</text><rect class="seq-bg" x="30" y="1544" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1563">MUST: BACKLOG_STATUS SUBMITTED</text><text class="seq-sub" x="45" y="1581">LOG: full revision + official receiptId; refresh and repeat for the next backlog item</text><line class="seq-edge" x1="340" y1="1598" x2="1080" y2="1598"/></g></a><a href="#step-16"><g><text class="seq-num" x="10" y="1645">20</text><rect class="seq-bg" x="30" y="1627" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1646">mtm-player signals a pause or match end</text><text class="seq-sub" x="45" y="1664">INPUT: sessionId, matchId, matchStatus=PAUSED / FINISHED / CANCELLED</text><line class="seq-edge" x1="95" y1="1681" x2="340" y2="1681"/></g></a><a href="#step-16"><g><text class="seq-num" x="10" y="1728">21</text><rect class="seq-bg" x="30" y="1710" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1729">Stop API calls, Git, workers, and polling; preserve source/evidence</text><text class="seq-sub" x="45" y="1747">On match end: log ORCHESTRATOR_ENDED; on pause: wait for mtm-player to resume</text><path class="seq-edge" d="M340 1762 h70 v9 h-70"/></g></a><a href="#step-17"><g><text class="seq-num" x="10" y="1811">22</text><rect class="seq-bg" x="30" y="1793" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1812">On resume: mtm-player starts a replacement Team Orchestrator Agent</text><text class="seq-sub" x="45" y="1830">INPUT: fresh access, paths, repository, restartAttempt, reason, prepared revision</text><line class="seq-edge" x1="95" y1="1847" x2="340" y2="1847"/></g></a><a href="#step-17"><g><text class="seq-num" x="10" y="1894">23</text><rect class="seq-bg" x="30" y="1876" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1895">MUST: ORCHESTRATOR_RESTARTED</text><text class="seq-sub" x="45" y="1913">Reconcile logs/Git/receipts; do not repeat accepted submissions</text><line class="seq-edge" x1="340" y1="1930" x2="1080" y2="1930"/></g></a></svg><p><strong>MUST:</strong> write logs to <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code>. Example match: <code>ABCD1234.progress.ndjson</code>. When mtm-player supplies <code>progressLogFile</code>, MUST use that exact path; append one JSON object per line without overwriting the file.</p></div><h3>Step-by-step instructions</h3><article class="step" id="step-1"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: receive input</span><span class="owner-tag owner-player">mtm-player: provide input</span></div><h3>1. Receive input and initialize</h3><p>The Team Orchestrator Agent receives session, team, match, repository, Git read access, account, password, allowed origins, and model policy. Read workspace AGENTS.md. No team bearer key is available in this step.</p><details><summary>Complete preparation input</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{

write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;ENVIRONMENT&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Required toolchain and dependencies are ready.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;BUILD&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Baseline checks and build passed.&quot;}</code></pre></div></article><article class="step" id="step-4"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: log in</span><span class="owner-tag owner-server">mtm-game-server: authenticate</span></div><h3>4. Log in to mtm-game-server</h3><p>Open the mtm-game-server URL supplied by mtm-player. Log in with the supplied username and password. Then explicitly open the page for the assigned matchId; do not rely on the default redirect.</p><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="text">Example URL: https://ai-fest-five.vercel.app/
Username: username supplied by mtm-player
Password: password supplied by mtm-player</code></pre></div></article><article class="step" id="step-5"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: read and verify</span><span class="owner-tag owner-server">mtm-game-server: display information</span></div><h3>5. Open the exact match and verify assignment</h3><p>After logging in, visit /match/&lt;matchId&gt; on the same mtm-game-server. For example, matchId ABCD1234 means https://ai-fest-five.vercel.app/match/ABCD1234. Read the match, team, repository/branch/folder, and backlog shown there. Verify them against mtm-player input. During preparation, verify access and assignment only; do not start backlog work.</p><aside>MUST open the page for the exact matchId; the generic /match page does not identify the task. Output is the visible match information and authorized backlog, without requiring a specific internal API response.</aside></article><article class="step" id="step-6"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: write readiness log</span><span class="owner-tag owner-player">mtm-player: read and validate the log</span></div><h3>6. Write the readiness log</h3><p>MUST log MATCH_LOGIN completed, then append an ENVIRONMENT_READY event to the exact progressLogFile through the team's progress writer/helper. mtm-player polls the log file, validates the event, and handles the required steps with mtm-game-server. The Team Orchestrator Agent does not send this JSON to an mtm-player API or need a parent task to forward it. The CLI final response may repeat the result for the reader; it does not replace the mandatory log.</p><details class="must-details"><summary>JSON appended to progress.ndjson — MUST; this is the channel to mtm-player</summary><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;ENVIRONMENT_READY&quot;,&quot;requestId&quot;:&quot;prepare-example&quot;,&quot;repository&quot;:{&quot;url&quot;:&quot;https://github.com/example/repo.git&quot;,&quot;branch&quot;:&quot;main&quot;,&quot;folder&quot;:&quot;ABCD1234&quot;},&quot;revision&quot;:&quot;0123456789abcdef0123456789abcdef01234567&quot;,&quot;build&quot;:&quot;PASS&quot;,&quot;matchLogin&quot;:&quot;PASS&quot;}</code></pre></div></details><details><summary>Information mtm-player reads and validates from the log</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{

  &quot;matchLogin&quot;: &quot;PASS&quot;
}</code></pre></div></details><details><summary>How mtm-player handles readiness</summary><p>mtm-player verifies the repository, revision, build, and login status from the progress log. When the data is valid, mtm-player informs mtm-game-server that the environment is ready, stores the result, and updates the preparation milestone. The Team Orchestrator Agent only needs to write the correct log; it does not perform mtm-player's operation.</p></details><aside>Flow: Team Orchestrator Agent → helper appends ENVIRONMENT_READY → progressLogFile → mtm-player polls and validates → mtm-player handles readiness with mtm-game-server. If the append does not succeed, mtm-player has not received readiness even if the transcript says preparation is complete.</aside></article><article class="step" id="step-7"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-player">mtm-player: send Preparation Complete</span><span class="owner-tag owner-server">mtm-game-server: confirm PREPARED</span></div><h3>7. Wait for mtm-player to acknowledge preparation</h3><p>mtm-player verifies readiness, reports preparation status to mtm-game-server, and waits for the system to accept it. The Team Orchestrator Agent does not perform this operation or write the milestone owned by mtm-player. Begin backlog work only after mtm-player supplies active-game input.</p><aside>There is no separate operator command to start backlogs after preparation completes.</aside></article><article class="step" id="step-8"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-player">mtm-player: provide active-game input</span><span class="owner-tag owner-orch">Team Orchestrator Agent: receive and validate</span></div><h3>8. Receive active-game access</h3><p>Validate environmentRevision, bearer UTF-8 length and SHA-256, origins, scopes, paths, and hostAuthorization. The helper retains repository and account information from preparation; start does not repeat them.</p><details><summary>Complete active-game input; sample key is fake</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{

<code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_STATUS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;title&quot;:&quot;Fix customer search&quot;,&quot;status&quot;:&quot;DISCOVERED&quot;,&quot;summary&quot;:&quot;Work status updated.&quot;,&quot;revision&quot;:null,&quot;receiptId&quot;:null}</code></pre></div></article><article class="step" id="step-10"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: call Start Work</span><span class="owner-tag owner-server">mtm-game-server: accept and return the task</span></div><h3>10. Start Work before editing</h3><p>The Team Orchestrator Agent calls POST /api/v1/matches/&lt;match.id UUID&gt;/backlogs/start on mtm-game-server to begin one backlog item. Send the team bearer key in Authorization and the selected backlogItemKey in the JSON body. mtm-game-server confirms Start Work and returns the template and scenarios. Only after acceptance does the Team Orchestrator Agent log IN_PROGRESS and begin editing source. Accept and Content-Type are application/json.</p><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;backlogItemKey&quot;: &quot;TASK-01&quot;
}</code></pre></div><details><summary>Illustrative output; use the actual response template and scenarios</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;backlogId&quot;: &quot;TASK-01&quot;,
  &quot;backlogType&quot;: &quot;TASK&quot;,
  &quot;replay&quot;: false,

    &quot;backlogId&quot;: &quot;TASK-01&quot;,

  },
  &quot;minimumVerificationScenarios&quot;: null,
  &quot;files&quot;: {
    &quot;challenge/TASK-01-submit.json&quot;: &quot;{ ...template JSON... }&quot;
  }
}</code></pre></div></details><aside><strong>MUST — Canonical submission paths:</strong> A file such as <code>challenge/TASK-01-submit.json</code> returned by Start Work is a source template only. Copy its content to <code>&lt;repository.folder&gt;/answers/TASK-01/submit.json</code>. Store every evidence file in <code>&lt;repository.folder&gt;/answers/TASK-01/evidence/</code> and reference it in JSON as <code>evidence/&lt;filename&gt;</code>. Never create or commit evidence under <code>&lt;repository.folder&gt;/evidence/</code> or <code>&lt;repository.folder&gt;/challenge/evidence/</code>. The team may enforce this contract with MCP, a helper, or another implementation.</aside><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;GAME_MASTER_API&quot;,&quot;operation&quot;:&quot;START_WORK&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;method&quot;:&quot;POST&quot;,&quot;origin&quot;:&quot;https://ai-fest-five.vercel.app&quot;,&quot;path&quot;:&quot;/api/v1/matches/11111111-1111-4111-8111-111111111111/backlogs/start&quot;,&quot;phase&quot;:&quot;REQUESTED&quot;,&quot;httpStatus&quot;:null,&quot;requestId&quot;:null,&quot;summary&quot;:&quot;Calling mtm-game-server.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;GAME_MASTER_API&quot;,&quot;operation&quot;:&quot;START_WORK&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;method&quot;:&quot;POST&quot;,&quot;origin&quot;:&quot;https://ai-fest-five.vercel.app&quot;,&quot;path&quot;:&quot;/api/v1/matches/11111111-1111-4111-8111-111111111111/backlogs/start&quot;,&quot;phase&quot;:&quot;SUCCEEDED&quot;,&quot;httpStatus&quot;:200,&quot;requestId&quot;:&quot;req-start&quot;,&quot;summary&quot;:&quot;Received the mtm-game-server result.&quot;}</code></pre></div></article><article class="step" id="step-11"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: implement and test</span></div><p>Before submitting, verify the exact Git revision contains <code>&lt;repository.folder&gt;/answers/&lt;backlogId&gt;/submit.json</code> and every referenced evidence file under its <code>evidence/</code> directory. Finding files at repository-root <code>answers/</code> is insufficient. Local writes use <code>matchRoot/answers/…</code>; Git checks use paths relative to <code>checkoutRoot</code>. Relative JSON references remain <code>evidence/&lt;filename&gt;</code>.</p><h3>11. Implement, test, and complete the answer</h3><p>Log IN_PROGRESS and BACKLOG_TESTS NOT_RUN; edit source; run required scenarios and relevant regression tests. In <code>submit.json</code>, evidence paths are relative to the backlog answer directory, for example <code>evidence/TASK-01-TC-01.json</code>; do not include <code>answers/TASK-01/</code> in those JSON values. Report RUNNING and then PASSED/FAILED with real counts. If blocked, log BLOCKER_OPENED; when resolved, log BLOCKER_RESOLVED with the same ID.</p><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_TESTS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;status&quot;:&quot;NOT_RUN&quot;,&quot;required&quot;:2,&quot;executed&quot;:0,&quot;passed&quot;:0,&quot;failed&quot;:0,&quot;skipped&quot;:0,&quot;summary&quot;:&quot;Tests have not run.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_TESTS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;status&quot;:&quot;PASSED&quot;,&quot;required&quot;:2,&quot;executed&quot;:2,&quot;passed&quot;:2,&quot;failed&quot;:0,&quot;skipped&quot;:0,&quot;summary&quot;:&quot;Both required tests passed.&quot;}</code></pre></div></article><article class="step" id="step-12"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: commit and push</span></div><h3>12. Commit and push to the assigned branch</h3><p>Complete the answer using the template. Commit source, tests, evidence, and answer together; push to the assigned repository and branch; obtain the full 40- or 64-character SHA. Do not submit an ambiguous HEAD reference.</p><aside>The answer does not contain gitRevision; the SHA belongs at the top level of the submission request.</aside></article><article class="step" id="step-13"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: send submission</span><span class="owner-tag owner-server">mtm-game-server: receive submission</span></div><h3>13. Submit the work</h3><p>The Team Orchestrator Agent calls POST /api/v1/matches/&lt;match.id UUID&gt;/submissions on mtm-game-server to submit the completed backlog item. The JSON body contains clientSubmissionId, backlogItemKey, gitRevision, and answer. Send the team bearer key in Authorization, use JSON headers, and set Idempotency-Key to clientSubmissionId. Log REQUESTED immediately before the call and its outcome immediately after the response.</p><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;clientSubmissionId&quot;: &quot;33333333-3333-4333-8333-333333333333&quot;,
  &quot;backlogItemKey&quot;: &quot;TASK-01&quot;,
  &quot;gitRevision&quot;: &quot;0123456789abcdef0123456789abcdef01234567&quot;,
  &quot;answer&quot;: {
    &quot;backlogId&quot;: &quot;TASK-01&quot;,
    &quot;status&quot;: &quot;SUBMITTED&quot;,
    &quot;changeSummary&quot;: &quot;Fixed search and tested the required scenarios.&quot;
  }
}</code></pre></div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="http">Authorization: Bearer &lt;runtime team key&gt;
Accept: application/json
Content-Type: application/json
Idempotency-Key: 33333333-3333-4333-8333-333333333333</code></pre></div></article><article class="step" id="step-14"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-server">mtm-game-server: return receipt</span><span class="owner-tag owner-orch">Team Orchestrator Agent: ghi SUBMITTED</span></div><h3>14. Receive the receipt and update the log</h3><p>mtm-game-server returns a receiptId and submission intake status (such as RECEIVED). The receipt confirms intake, not grading. The Team Orchestrator Agent MUST log BACKLOG_STATUS SUBMITTED with the full Git SHA and official receiptId so mtm-player can display it. HTTP 2xx without an acceptance receipt is not enough to report SUBMITTED.</p><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;receiptId&quot;: &quot;receipt-123&quot;,
  &quot;status&quot;: &quot;RECEIVED&quot;
}</code></pre></div><div class="log-destination"><strong class="must-write">MUST write to file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Example: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Use the exact <code>progressLogFile</code> for the current session when supplied. <strong>Append content:</strong> The JSON below plus one newline (UTF-8). Do not overwrite the file. Replace playerSessionId and sample values with real session data.</div><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_STATUS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;title&quot;:&quot;Fix customer search&quot;,&quot;status&quot;:&quot;SUBMITTED&quot;,&quot;summary&quot;:&quot;Work status updated.&quot;,&quot;revision&quot;:&quot;0123456789abcdef0123456789abcdef01234567&quot;,&quot;receiptId&quot;:&quot;receipt-123&quot;}</code></pre></div></article><article class="step" id="step-15"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-orch">Team Orchestrator Agent: continue or wait</span></div><h3>15. Repeat while the match is active</h3><p>Refresh after each submission. Choose the next item or wait for publication; use bounded, non-overlapping polling. Example helper cadence: 5 seconds after success, 10 after an error. The Team Orchestrator Agent waits up to 55 seconds per tool call before checking again.</p><aside>On submit timeout, preserve the UUID and body; reconcile or retry with the same idempotency key. Empty backlog, expired login, or temporary access issues are waiting/blocker states, not match completion.</aside></article><article class="step" id="step-16"><div class="owner-tags" aria-label="Responsible components"><span class="owner-tag owner-player">mtm-player: send pause/end</span><span class="owner-tag owner-orch">Team Orchestrator Agent: stop work</span></div><h3>16. Pause, end, and stop</h3><p>mtm-player sends session, match, and matchStatus. Stop new API, Git, tool, worker, and polling activity and pack-owned processes; preserve source and evidence. Do not log ORCHESTRATOR_ENDED for a pause. At match end, log the event if possible; do not submit further work.</p><details><summary>Input pause</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
