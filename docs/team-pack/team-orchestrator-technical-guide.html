  }
}</code></pre></div></details><p>Do not duplicate events written by the helper. DISCOVERED must not reset IN_PROGRESS or SUBMITTED. If append fails, keep a bounded queue and retry in order; report PROGRESS_LOG_UNAVAILABLE if recovery fails.</p></section><section id="section-4"><h2>4. Guardrails against violations</h2><p>The Team Orchestrator Agent and every team-started worker, tool, or process must stay within the scope granted by mtm-player and the contest rules.</p><div class="table-wrap"><table><thead><tr><th>Guardrail MUST</th><th>Where to enforce it</th><th>Violations to avoid</th></tr></thead><tbody><tr><td>Workspace and source</td><td>Use canonical paths and block links and path escapes. Access only the assigned source/folder; outside the source, append only to the designated log.</td><td>Reading another team's files, hidden tests, grader, answer keys, mtm-player private state, or another task's transcript.</td></tr><tr><td>Git repository/branch</td><td>Verify the assignment before Git operations; use ordinary commits and pushes only; do not force-push or change the remote.</td><td>Pushing to another repository, changing the remote, or resetting remote history.</td></tr><tr><td>Network/API</td><td>Allowlist the origin and match UUID; use exact Start/Submit paths and correctly scoped cookies or bearer tokens; block unexpected redirects.</td><td>Calling private grader, organizer, or mtm-player control APIs, or using a key outside the assigned server.</td></tr><tr><td>Credential</td><td>Keep credentials in helper memory; exclude them from shell arguments, logs, source, Git config, raw tool output, and worker prompts.</td><td>Saving passwords or bearer tokens in files or commits. Team code must not use mtm-player secrets.</td></tr><tr><td>Model policy</td><td>Use the latest allowedModels; the Team Orchestrator Agent and its descendants must not substitute a prohibited model. Report unknown when the provider does not supply the information.</td><td>Ignoring model policy or reporting fabricated token counts or models.</td></tr><tr><td>Lifecycle</td><td><span class="must-not">MUST NOT</span>: Subagents must remain in the same CLI session. MTM-player continuously monitors and will stop the entire agent tree if a violation occurs.</td><td>Launching Codex, Claude, app-server, or another CLI process to evade monitoring, continue after stop, or create agents outside the managed tree.</td></tr><tr><td>Submission paths</td><td>Treat <code>challenge/&lt;ID&gt;-submit.json</code> as source only; materialize <code>answers/&lt;ID&gt;/submit.json</code> and store evidence only under <code>answers/&lt;ID&gt;/evidence/</code>.</td><td>Using the template folder as the destination; committing root <code>evidence/</code> or <code>challenge/evidence/</code>; putting repository-relative paths in JSON.</td></tr><tr><td>Telemetry</td><td>Emit required events at the correct milestone and follow the schema; exclude secrets and raw bodies; report actual receipts and test results.</td><td>Reporting SUBMITTED without a receipt or PASSED without tests, or fabricating events to conceal actions.</td></tr><tr><td>Approval/authentication</td><td>Route provider requests through mtm-player; keep the agent alive while pending; report a blocker if rejected or unavailable; the operator handles Git authentication.</td><td>Modifying mtm-player to bypass approvals or logging in with credentials outside the authorized scope.</td></tr></tbody></table></div><aside>Actions outside these guardrails may be recorded as a Suspected Violation and handled under the contest rules.</aside><h3>Common problems</h3><ul><li>Expired cookie: reauthenticate the current session and refresh. Rejected bearer token: report a blocker and wait for authorized recovery.</li><li>Server/request timeout: keep the submission UUID unchanged while the outcome is uncertain.</li><li>No backlog available: keep the Team Orchestrator Agent waiting; do not return a terminal result.</li><li>Workspace moved after installation: rerun the installer to update the MCP path and reload the provider session.</li></ul></section><section id="section-5"><h2>5. Package the team pack</h2><h3>Naming and identity rules — MUST</h3><p>Team Orchestrator Agent is the role; its required registered name is <code>team_orchestrator</code> (underscore), rather than <code>team-orchestrator</code>. Hyphens are used in file paths. The following names are current mtm-player compatibility requirements, not team names.</p><div class="table-wrap"><table><thead><tr><th>Location</th><th>Required value</th></tr></thead><tbody><tr><td>package.json → name</td><td>team-sdlc-pack</td></tr><tr><td>team-runtime.json → name / kind</td><td>team-sdlc-pack / mtm-team-runtime</td></tr><tr><td>entrypoint.rootAgentType</td><td>team_orchestrator</td></tr><tr><td>agents/team-orchestrator.toml → name</td><td>team_orchestrator</td></tr><tr><td>Orchestrator skill file (not a manifest field)</td><td>skills/team-orchestrator/SKILL.md</td></tr><tr><td>File identity trong package</td><td>team-pack-info.json</td></tr><tr><td>Installed identity file</td><td>&lt;TeamWorkspace&gt;/.mtm/team-pack-info.json; the payload copy is in team-sdlc-pack/runtime/</td></tr></tbody></table></div><p>The source folder, ZIP filename, and TeamWorkspace path may use the team's name (for example HNKSUPER); MUST NOT change the package name to the team name. mtm-player manages the runtime session, so no custom session name is needed. Teams may share a package name, but each MUST use its own teamId registered on mtm-game-server.</p><h4>team-pack-info.json — exactly four fields; no additional fields</h4><ul><li><code>schemaVersion</code>: integer 1.</li><li><code>version</code>: a string in X.Y.Z format; MUST match the version in package.json and team-runtime.json.</li><li><code>teamId</code>: the registered team code, not the team record UUID. Use 1–128 characters, starting with a letter or digit, followed only by letters, digits, underscores, periods, colons, or hyphens. MUST match the initialized team; mtm-player compares IDs without case sensitivity.</li><li><code>teamName</code>: the team name; 1–160 characters, with no leading or trailing whitespace, newline, or NUL. MUST use the actual team name instead of the example name.</li></ul><p>For example, HNKSUPER uses teamId <code>HNKSUPER</code>, teamName <code>HNK Super</code>; HNK uses its own identity. The installer MUST keep the identity copies in the payload and .mtm synchronized. Changing only one copy may cause an mtm-player registration/payload mismatch. A complete JSON example follows.</p><p>The minimal pack uses Node built-ins, without npm dependencies or installation lifecycle hooks. mtm-player currently requires four provider profiles: <code>team_orchestrator</code>, <code>team_repo_scout</code>, <code>team_feature_worker</code>, <code>team_quality_checker</code>. These are profile registrations; the Team Orchestrator Agent may spawn subagents only through the provider's native mechanism in the same CLI session, when separating responsibilities is useful. The roles in section 2 may be performed by these profiles or by the Team Orchestrator Agent.</p><details><summary>package.json — preserve the order of the files array</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;name&quot;: &quot;team-sdlc-pack&quot;,
  &quot;version&quot;: &quot;1.0.0&quot;,
  &quot;type&quot;: &quot;module&quot;,
  &quot;private&quot;: true,
  &quot;files&quot;: [
    &quot;agents/&quot;,
    &quot;bin/&quot;,
    &quot;config/&quot;,
    &quot;contracts/&quot;,
    &quot;docs/&quot;,
    &quot;install.ps1&quot;,
    &quot;scripts/check-distribution.mjs&quot;,
    &quot;scripts/install.mjs&quot;,
    &quot;skills/&quot;,
    &quot;src/&quot;,
    &quot;README.md&quot;,
    &quot;team-pack-info.json&quot;,
    &quot;team-runtime.json&quot;
  ]
}</code></pre></div></details><details><summary>team-pack-info.json — replace ID/name/version before building</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
  &quot;version&quot;: &quot;1.0.0&quot;,
  &quot;teamId&quot;: &quot;T01&quot;,
  &quot;teamName&quot;: &quot;Example Team&quot;
}</code></pre></div></details><details><summary>team-runtime.json — complete manifest for the minimal pack</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
  &quot;kind&quot;: &quot;mtm-team-runtime&quot;,
  &quot;name&quot;: &quot;team-sdlc-pack&quot;,
  &quot;version&quot;: &quot;1.0.0&quot;,
  &quot;protocolVersion&quot;: 4,
  &quot;provider&quot;: &quot;codex&quot;,
  &quot;entrypoint&quot;: {
    &quot;rootAgentType&quot;: &quot;team_orchestrator&quot;
  }
}</code></pre></div></details><details><summary>Suggested Team Orchestrator Agent profile; no pinned model or permission overrides</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="toml">name = &quot;team_orchestrator&quot;
description = &quot;MTM contestant Team Orchestrator and project manager.&quot;
developer_instructions = &quot;&quot;&quot;
Read .agents/skills/team-orchestrator/SKILL.md and obey all mtm-player lifecycle instructions.
Coordinate the Business Analyst, Developer, Cyber Security, and Tester responsibilities.
Spawn subagents only with the provider-native mechanism in this same CLI session.
Use the registered team_repo_scout, team_feature_worker, and team_quality_checker profiles when useful.
Do not launch another Codex CLI, Claude Code CLI, app-server, or independent CLI process for match work.
Keep credentials in MCP Helper memory; append required events to the exact progressLogFile.
Own integration, Git actions, submissions, receipts, and final decisions.
Honor pause/end immediately; do not self-respawn or resume.
&quot;&quot;&quot;</code></pre></div></details><details><summary>config/codex.toml — the installer expands only this path</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="toml">[mcp_servers.mtm_minimal]
command = &quot;node&quot;
args = [&quot;../team-sdlc-pack/runtime/bin/runtime-server.mjs&quot;]
startup_timeout_sec = 15
tool_timeout_sec = 120</code></pre></div></details><p>The auxiliary profiles use the registered names above. <code>team_repo_scout</code> handles Business Analyst and Cyber Security responsibilities; <code>team_feature_worker</code> handles Developer responsibilities; <code>team_quality_checker</code> handles Tester responsibilities. A given backlog may not require every profile to be spawned. The manifest must contain exactly the fields shown below. Additional root or entrypoint fields are rejected. Keep instructions in agent profiles and skill files; do not add capabilities, supportedMessages, isolation, or hostRequirements to this manifest. The Team Orchestrator Agent must still follow allowedModels from its input.</p><h3>Installer and checker responsibilities</h3><ol><li>Accept an absolute TeamWorkspace, resolve paths, and reject symlinks, junctions, and unsafe targets.</li><li>Verify the package, version, checksum, Team ID/name, and existence of every declared file. Create matches and team-sdlc-pack if missing.</li><li>Copy package.json and package.files entries into runtime; copy profiles, skills, manifest, and identity to the layout in section 2.</li><li>Expand the MCP arguments to absolute runtime paths, using JSON-quoted paths and forward slashes in TOML; keep the source package portable. mtm-player compares registration bytes exactly and accepts only this expansion.</li><li>Reinstalling the same version must be idempotent. Upgrades replace only pack-owned files; do not delete match checkouts or logs or overwrite configuration outside the pack.</li><li>The read-only checker verifies registration/payload parity, identity/version, schema/manifest, and a READY result; exit with a nonzero code on failure.</li><li>Package the complete source, installer, checker, and checksum in a ZIP. For npm pack tgz, the outer installer must extract and verify it; do not pass a tgz to an installer that accepts only directories.</li></ol><details><summary>Minimal install.ps1 wrapper</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="powershell">param([Parameter(Mandatory=$true)][string]$TeamWorkspace)
$ErrorActionPreference = 'Stop'
&amp; node (Join-Path $PSScriptRoot 'scripts/install.mjs') --team-workspace $TeamWorkspace
if ($LASTEXITCODE -ne 0) { throw 'TEAM_PACK_INSTALL_FAILED' }</code></pre></div></details><details><summary>Operator commands</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="powershell">powershell -NoProfile -ExecutionPolicy Bypass -File .\minimal-pack\install.ps1 -TeamWorkspace &quot;D:\mtm\T01&quot;
node .\minimal-pack\scripts\check-distribution.mjs --team-workspace &quot;D:\mtm\T01&quot;
Compress-Archive -LiteralPath .\minimal-pack -DestinationPath .\team-pack-T01-1.0.0.zip
Get-FileHash -LiteralPath .\team-pack-T01-1.0.0.zip -Algorithm SHA256</code></pre></div></details><p>The operator selects the workspace and Load team pack in mtm-player, checks the identity, and initializes the session. Team runtime does not call private mtm-player APIs to initialize itself. Verify MCP initialize/tools/list and configure/report in a fresh provider context; installed files alone do not establish that the host loaded the tools.</p><h3>Wire markers for parser implementation</h3><p>The sequence uses operation names. The parser must match the actual markers in the following table. Parse the JSON line after the marker and the model-policy suffix separately; do not parse the entire prompt as JSON.</p><div class="table-wrap"><table><thead><tr><th>Operation</th><th>Actual input marker</th><th>descriptor.type</th></tr></thead><tbody><tr><td>Preparation</td><td>PREPARE_GAME_V2</td><td>PREPARE_GAME</td></tr><tr><td>Start backlog work</td><td>START_GAME_V4</td><td>START_GAME</td></tr><tr><td>Resume preparation</td><td>RESUME_PREPARATION_V1</td><td>RESUME_PREPARATION</td></tr><tr><td>Resume game</td><td>RESUME_GAME_V1</td><td>RESUME_GAME</td></tr><tr><td>Pause</td><td>MATCH_PAUSED_V1</td><td>MATCH_PAUSED</td></tr><tr><td>End</td><td>MATCH_ENDED_V1</td><td>MATCH_ENDED</td></tr><tr><td>Model rule</td><td>MTM_MODEL_POLICY_V1</td><td>schemaVersion, orchestratorModel, allowedModels, enforcement, catalogSource, catalogFetchedAt, instruction</td></tr></tbody></table></div><h3>Smoke test before delivery</h3><p>Use a mock server with the fictitious data in this HTML to cover login/cookies, correct match identity, empty/new backlog, Start Work/templates, submission receipts, timeout retries with the same UUID, expired authentication, append failures, pause/end, and resume. Loopback HTTP is for mock-test mode only; production uses an allowed HTTPS origin. Test the final ZIP in a clean workspace and reinstall it; existing source must be preserved. Exclude credentials, actual match logs, caches, and hidden competition-system files from the archive.</p><details><summary>Prompt for a new session with only this guide</summary><div class="code"><button class="copy" type="button">Copy</button><pre><code data-lang="text">Using only this HTML guide, create a minimal team pack for Team ID &lt;ID&gt;, name &lt;Name&gt;, version 1.0.0.
Use one Codex orchestrator with provider-native subagents in the same session when useful; do not launch a second CLI.
Create all files, manifest, profiles, skills, the guide's JSON progress schema, installer/checker, and mock tests.
Implement the lifecycle input/output from section 3, API cookie/bearer/idempotency handling, and mandatory logs.
Do not import reference-pack source or mtm-player internals or call private mtm-player APIs.
Verify manifest/registration parity, MCP handshake, readiness, Start/Submit, retry, stop/resume.
Build the ZIP/checksum and installation README. Use actual public templates from the server; if a response does not match, report a blocker instead of guessing.
Do not hard-code real credentials, repositories, or models.</code></pre></div></details></section><footer class="smallprint">English version · Schema and metadata snapshots come from the current source. API examples are not production data. The internal architecture is a suggestion; the team is responsible for compatibility and guardrails.</footer></main></div></template><template id="guide-vi"><header><div class="eyebrow">MASTER THE MACHINE · CONTESTANT GUIDE</div><h1>Xây Team Orchestrator cho MTM</h1><p class="guide-version" data-guide-version="0.5.1">Phiên bản tài liệu: <strong>0.5.1</strong></p><p class="environment-note"><strong>Note:</strong> Hệ thống hiện tại của Ban Tổ Chức có thể hỗ trợ cả Codex và Claude Code. Tuy nhiên, để tạo ra môi trường đồng nhất và công bằng cho Orchestrator của các đội thi đấu với nhau, Ban Tổ Chức quyết định sử dụng Codex làm môi trường thi đấu. Vì vậy, xin đừng hỏi có thể dùng Claude Code để thi đấu hay không.</p><div class="prank-note"><span class="emoji" aria-hidden="true">🤪</span><strong>Warning:</strong> Đừng có tin tất cả nội dung trong guide này, vì có thể chúng tôi (Ban tổ chức) đang cố tình làm rối trí bạn.</div><div class="guide-actions"><nav class="language-switch" aria-label="Language"><button type="button" data-language="vi" class="selected" aria-current="page">Tiếng Việt</button><button type="button" data-language="en">English</button></nav></div></header><div class="layout"><nav aria-label="Mục lục"><a href="#section-1">1. Mô hình cuộc chơi</a><a href="#section-2">2. Cấu trúc orchestrator</a><a href="#section-3">3. Sequence & dữ liệu</a><a href="#section-4">4. Guardrail & violation</a><a href="#section-5">5. Đóng gói team-pack</a></nav><main><section id="section-1"><h2>1. Mô hình cuộc chơi</h2><div class="diagram"><svg viewBox="0 0 1080 330" role="img" aria-label="Mô hình liên kết mtm-game-server, Player, orchestrator, Git và progress log"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4dd9ee"/></marker></defs><g class="node entity-player"><rect x="15" y="110" width="220" height="100"/><text x="125" y="150">mtm-player</text><text class="small" x="125" y="178">Khởi chạy • giám sát • approvals</text></g><g class="node entity-orch"><rect x="390" y="110" width="250" height="100"/><text x="515" y="150">TEAM ORCHESTRATOR</text><text class="small" x="515" y="178">Chuẩn bị • code • test • submit</text></g><g class="node entity-server"><rect x="810" y="15" width="250" height="95"/><text x="935" y="54">mtm-game-server</text><text class="small" x="935" y="81">Đề • thời gian • trạng thái • receipt</text></g><g class="node"><rect x="810" y="210" width="250" height="95"/><text x="935" y="250">GIT ĐƯỢC GIAO</text><text class="small" x="935" y="278">Source • branch • revision</text></g><g class="edge"><path d="M235 140 H390"/><path d="M640 140 L810 80"/><path d="M640 180 L810 240"/><path d="M125 110 V62 H810"/><path d="M515 210 V280 H125 V210"/></g><g class="labels"><text x="312" y="124">Đầu vào / start / stop</text><text x="720" y="93">Login • backlog • submit</text><text x="720" y="231">Checkout • commit • push</text><text x="420" y="49">mtm-player: team info • preparation complete • match status</text><text x="320" y="302">Orchestrator → progress.ndjson → mtm-player dashboard</text></g></svg></div><div class="table-wrap"><table><thead><tr><th>Thành phần</th><th>Vai trò</th><th>Đầu vào / đầu ra chính</th></tr></thead><tbody><tr><td>mtm-game-server</td><td>Cung cấp match/backlog/assignment, quản lý thời gian và trạng thái, nhận submissions và trả receipt. Grading/điểm là kết quả chính thức từ hệ thống tổ chức.</td><td>Account/cookie cho projection; team bearer cho Start/Submit. Trả match/team/repo/backlog/API endpoints và receipt.</td></tr><tr><td>mtm-player</td><td>mtm-player init, kiểm tra pack, chạy CLI/Team Orchestrator Agent, gửi access cho từng phase, nhận readiness, theo dõi match, stop/resume, approvals và dashboard.</td><td>Input operator: workspace, team, match, server access, model/approval choices. Output cho Team Orchestrator Agent: dữ liệu chuẩn bị/game/control/recovery.</td></tr><tr><td>Team Orchestrator</td><td>Hệ thống của đội: chuẩn bị source, đồng bộ đề, quyết định thứ tự, code/test, commit/push, gọi Start Work/Submit và báo progress.</td><td>Nhận dữ liệu từ mtm-player, public đề từ Server; trả readiness và append log. Có thể dùng worker nội bộ.</td></tr><tr><td>Git được giao</td><td>Source/branch/folder của đề và immutable revision để submit.</td><td>Team Orchestrator Agent checkout, commit, push trong phạm vi được giao.</td></tr><tr><td>Progress NDJSON</td><td>Kênh trạng thái nghiệp vụ để mtm-player dựng preparation/backlog/tests/blockers/API activity.</td><td>Team helper/Team Orchestrator Agent append; mtm-player đọc. Transcript không thay thế log.</td></tr></tbody></table></div><aside>mtm-game-server quyết định trạng thái trận và acceptance. Progress log báo trạng thái của đội và transcript không thay thế các log bắt buộc.</aside></section><section id="section-2"><h2>2. Cấu trúc orchestrator gợi ý</h2><p>Sơ đồ dưới đây đề xuất Team Orchestrator làm Project Manager cùng bốn agent theo vai trò. Thư mục agents trong pack example dùng cùng cấu trúc: mỗi file TOML có name khớp tên agent và description. Đây là cấu trúc tham khảo; registrations được mtm-player chấp nhận có thể phụ thuộc phiên bản. MCP Helper và Progress NDJSON là thành phần runtime dùng chung.</p><div class="diagram"><svg viewBox="0 0 1100 560" role="img" aria-label="Cấu trúc Team Orchestrator, bốn agent chuyên môn, MCP Helper và Progress NDJSON"><g class="node entity-orch"><rect x="365" y="20" width="370" height="92"/><text x="550" y="57">TEAM ORCHESTRATOR</text><text class="small" x="550" y="83">Project Manager • điều phối • quyết định cuối</text></g><g class="node entity-orch"><rect x="20" y="180" width="235" height="88"/><text x="137" y="214">BUSINESS ANALYST</text><text class="small" x="137" y="240">Yêu cầu • acceptance criteria</text></g><g class="node entity-orch"><rect x="285" y="180" width="235" height="88"/><text x="402" y="214">DEVELOPER</text><text class="small" x="402" y="240">Thiết kế • code • integration</text></g><g class="node entity-orch"><rect x="550" y="180" width="235" height="88"/><text x="667" y="214">CYBER SECURITY</text><text class="small" x="667" y="240">Guardrails • secrets • scope</text></g><g class="node entity-orch"><rect x="815" y="180" width="265" height="88"/><text x="947" y="214">TESTER</text><text class="small" x="947" y="240">Test • regression • evidence</text></g><g class="node"><rect x="175" y="370" width="330" height="100"/><text x="340" y="406">MCP HELPER — NODE.JS</text><text class="small" x="340" y="432">Session • Game API • retry</text><text class="small" x="340" y="452">Credential-safe runtime</text></g><g class="node progress-node"><rect x="595" y="370" width="330" height="100"/><text x="760" y="406">PROGRESS NDJSON</text><text class="small" x="760" y="432">Readiness • backlog • tests • blockers</text><text class="small" x="760" y="452">mtm-player đọc file này</text></g><g class="edge"><path d="M550 112 V145 H137 V180"/><path d="M550 145 H402 V180"/><path d="M550 145 H667 V180"/><path d="M550 145 H947 V180"/><path d="M137 268 V320 H340 V370"/><path d="M402 268 V320 H340"/><path d="M667 268 V320 H340"/><path d="M947 268 V320 H340"/><path d="M505 420 H595"/><path d="M550 112 V340 H760 V370"/></g><g class="labels"><text x="550" y="138">spawn • giao việc • review • tổng hợp</text><text x="550" y="350">tools/call</text><text x="550" y="408">append</text><text x="550" y="520">Không có progress log đúng và đủ, mtm-player không thể theo dõi chính xác trạng thái của đội</text></g></svg></div><aside class="must-not-box"><span class="must-not">MUST NOT</span> — Team Orchestrator chỉ được spawn subagent bằng cơ chế native của provider trong cùng CLI session đang chạy. Không khởi chạy thêm Codex CLI, Claude Code CLI, app-server hoặc CLI process độc lập khác để thực hiện công việc của trận.</aside><div class="table-wrap"><table><thead><tr><th>Module</th><th>Nhiệm vụ</th></tr></thead><tbody><tr><td>Team Orchestrator Agent</td><td>Đóng vai trò Project Manager: nhận lifecycle input, chọn backlog, giao việc, kiểm tra kết quả, tích hợp thay đổi và chịu trách nhiệm quyết định cuối.</td></tr><tr><td>Business Analyst</td><td>Đọc backlog, làm rõ yêu cầu, acceptance criteria, constraint và dữ liệu đầu vào cho Developer và Tester.</td></tr><tr><td>Developer</td><td>Khảo sát source, thiết kế thay đổi, implement, chạy kiểm tra kỹ thuật và chuẩn bị commit.</td></tr><tr><td>Cyber Security</td><td>Kiểm tra guardrail, phạm vi workspace/network, credential handling và các hành động có nguy cơ violation.</td></tr><tr><td>Tester</td><td>Lập test scenario từ acceptance criteria, chạy regression, xác nhận kết quả và evidence trước submission.</td></tr><tr><td>MCP Helper — Node.js</td><td>Runtime dùng chung cho session, cookie/bearer trong memory, Game API, retry/idempotency và append progress log. Các agent gọi helper thay vì tự giữ credential hoặc tự gọi HTTP.</td></tr><tr><td>Progress NDJSON</td><td>File trạng thái bắt buộc để mtm-player đọc readiness, backlog, test, blocker và API activity. MCP Helper append từng JSON object trên một dòng vào đúng progressLogFile; transcript không thay thế file này.</td></tr></tbody></table></div><h3>Cấu trúc khai báo agent</h3><p>Ví dụ cấu trúc dưới đây tương ứng với role Developer trong sơ đồ, sử dụng file <code>agents/team_developer.toml</code>.</p><details><summary>agents/team_developer.toml — cấu trúc minh họa</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="toml">name = &quot;team_developer&quot;
description = &quot;Developer agent profile.&quot;</code></pre></div></details><p>Tên trong trường <code>name</code> phải trùng với tên agent trong tên file (bỏ phần mở rộng <code>.toml</code>). Các file profile chỉ minh họa cấu trúc khai báo; chúng không chứa instruction hoặc source triển khai.</p><details><summary>Cấu trúc folder source package và workspace sau khi cài</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="text">team-orchestrator-pack-example/
  package.json
  team-pack-info.json
  team-runtime.json
  logs/MATCH_ID.progress.ndjson # file trống; thay MATCH_ID bằng matchId thực
  README.md
  install.ps1
  agents/                      # root + four roles from section 2
    team-orchestrator.toml
    team-business-analyst.toml
    team-developer.toml
    team-cyber-security.toml`n    team-tester.toml
  config/codex.toml
  skills/                      # instruction structure
    team-orchestrator/SKILL.md
    game-preparation/SKILL.md
    team-recovery/SKILL.md
  bin/runtime-server.mjs       # MCP Helper
  src/runtime-session.mjs
  contracts/progress-event.schema.json
  docs/README.md
  scripts/install.mjs
  scripts/check-distribution.mjs

The five agent files show the suggested structure in section 2. Each file contains only a matching name and description. This is an illustrative role structure; mtm-player registration compatibility depends on the installed mtm-player version. MCP Helper and Progress NDJSON are shared runtime components, not agent profiles.

Sau cài đặt: &lt;teamWorkspace&gt;/
  matches/
    &lt;matchId&gt;/             # checkoutRoot: Git checkout, chứa .git/
      &lt;repository.folder&gt;/ # matchRoot: folder bài thi được giao
        src/
        challenge/
        answers/
          &lt;backlogId&gt;/
            submit.json
            evidence/
  team-sdlc-pack/runtime/     # payload bất biến
  team-sdlc-pack/logs/        # log riêng từng round/session
  .mtm/                      # team-runtime.json, team-pack-info.json
  .codex/agents/             # bản sao các profile
  .codex/config.toml         # MCP path tuyệt đối
  .agents/skills/            # bản sao các skill</code></pre></div><h4>team-pack-info.json — file bắt buộc có cấu trúc cố định</h4><p>MUST tạo file này tại thư mục gốc package. Giữ đúng 4 field như mẫu; không đổi tên field và không thêm field. schemaVersion giữ số 1. Thay teamId và teamName bằng mã và tên đội đã đăng ký trên mtm-game-server; teamId không phải UUID. Thay version bằng phiên bản package, MUST giống version trong package.json và team-runtime.json.</p><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
  &quot;version&quot;: &quot;1.0.0&quot;,
  &quot;teamId&quot;: &quot;HNKSUPER&quot;,
  &quot;teamName&quot;: &quot;HNK Super&quot;
}</code></pre></div><p>Ví dụ trên là identity của HNKSUPER. Đội khác MUST thay identity của mình trước khi build. Installer copy file vào team-sdlc-pack/runtime/team-pack-info.json và .mtm/team-pack-info.json trong TeamWorkspace. mtm-player đọc identity này khi Load team pack; hai bản MUST đồng bộ. Xem <a href="#section-5">phần 5</a> để biết giới hạn ký tự và quy tắc đặt tên.</p></details><h3>Checkout root và match root</h3><p>Dùng đường dẫn tuyệt đối do mtm-player cung cấp. <code>checkoutRoot</code> chứa Git checkout và <code>.git/</code>. <code>matchRoot = checkoutRoot/repository.folder</code> chứa source được giao, đề bài công khai, answers và evidence. Match ID lặp lại trong ví dụ là có chủ ý: folder ngoài xác định checkout trên máy, folder trong đến từ repository assignment của server.</p><p>Clone vào <code>checkoutRoot</code>; build, test và ghi answers trong <code>matchRoot</code>. Worktree của specialist dùng <code>worktreeRoot/repository.folder</code> làm matchRoot. Truyền cả hai đường dẫn cho specialist. Field tương thích <code>challengeWorkspace</code> có thể trỏ tới <code>matches/</code>; dùng hai root tường minh, không coi field này là folder source. Không sửa folder của các match khác. Init/reset chỉ tác động checkout của match được chọn; các match cũ vẫn được giữ lại. Resume dùng đường dẫn đã lưu và giữ công việc đã hoàn thành.</p><h3>Tool helper cần triển khai</h3><div class="table-wrap"><table><thead><tr><th>Tool gợi ý</th><th>Input</th><th>Output và hành vi</th></tr></thead><tbody><tr><td>configure_session</td><td>descriptor, modelPolicy nếu có</td><td>Safe session/paths; prepare derives paths từ trusted cwd; start giữ verified portal/repo và thay bearer client; resume thay access từ dữ liệu mới.</td></tr><tr><td>login_match</td><td>{}</td><td>Authenticate cookie session; chỉ trả status an toàn.</td></tr><tr><td>refresh_match</td><td>{}</td><td>Projection hiện tại; identity/repo verification; DISCOVERED mới chỉ trong game.</td></tr><tr><td>start_work</td><td>backlogItemKey</td><td>Public requirements/template/scenarios; tự log trước/sau HTTP.</td></tr><tr><td>submit_work</td><td>clientSubmissionId, backlogItemKey, gitRevision, answer</td><td>Official receipt; UUID giữ nguyên khi response không rõ.</td></tr><tr><td>report_progress</td><td>event chưa có envelope</td><td>Bổ sung schemaVersion/playerSessionId và append schema-valid event.</td></tr><tr><td>wait_for_update</td><td>timeoutMs ≤ 55000</td><td>Serial bounded polling; return khi đổi hoặc timeout; dừng theo control.</td></tr></tbody></table></div><p>MCP qua stdin/stdout: JSON-RPC mỗi dòng; triển khai initialize, notifications/initialized, tools/list và tools/call. tools/list phải có inputSchema cho từng tool. Chỉ JSON-RPC lên stdout; tool output dạng content text chứa JSON an toàn. Request có timeout, response size limit và redirect/origin checks.</p></section><section id="section-3"><h2>3. Từ lúc spawn đến finish game</h2><aside>MUST log GAME_MASTER_API REQUESTED ngay trước <em>mọi</em> request login/refresh/Start/Submit; SUCCEEDED hoặc FAILED ngay sau kết quả, kể cả lỗi. Sequence dùng tên thao tác và dữ liệu; các bước dưới giải thích đầy đủ input/output.</aside><div class="diagram"><svg viewBox="0 0 1190 2014" class="sequence" role="img" aria-label="Sequence từ spawn orchestrator đến kết thúc và resume"><defs><marker id="seq-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4dd9ee"/></marker></defs><text class="lane-title entity-player" x="95" y="28">mtm-player</text><line class="lane" x1="95" y1="43" x2="95" y2="2004"/><text class="lane-title entity-orch" x="340" y="28">Orchestrator</text><line class="lane" x1="340" y1="43" x2="340" y2="2004"/><text class="lane-title entity-server" x="620" y="28">mtm-game-server</text><line class="lane" x1="620" y1="43" x2="620" y2="2004"/><text class="lane-title " x="880" y="28">Assigned Git</text><line class="lane" x1="880" y1="43" x2="880" y2="2004"/><text class="lane-title " x="1080" y="28">Progress log</text><text class="seq-sub" x="1080" y="47" text-anchor="middle">&lt;matchId&gt;.progress.ndjson</text><line class="lane" x1="1080" y1="43" x2="1080" y2="2004"/><a href="#step-1"><g><text class="seq-num" x="10" y="68">1</text><rect class="seq-bg" x="30" y="50" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="69">mtm-player spawn Team Orchestrator Agent mới</text><text class="seq-sub" x="45" y="87">INPUT: team T01, match ABCD1234, repo/branch/folder, account, origins, model list</text><line class="seq-edge" x1="95" y1="104" x2="340" y2="104"/></g></a><a href="#step-1"><g><text class="seq-num" x="10" y="151">2</text><rect class="seq-bg" x="30" y="133" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="152">MUST: ORCHESTRATOR_STARTED</text><text class="seq-sub" x="45" y="170">OUTPUT log: schemaVersion=1, playerSessionId, type, summary</text><line class="seq-edge" x1="340" y1="187" x2="1080" y2="187"/></g></a><a href="#step-2"><g><text class="seq-num" x="10" y="234">3</text><rect class="seq-bg" x="30" y="216" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="235">Kiểm tra quyền Git → checkout đúng source</text><text class="seq-sub" x="45" y="253">INPUT: repository.url, branch=main, folder=ABCD1234; OUTPUT: full revision</text><line class="seq-edge" x1="340" y1="270" x2="880" y2="270"/></g></a><a href="#step-3"><g><text class="seq-num" x="10" y="317">4</text><rect class="seq-bg" x="30" y="299" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="318">Cài dependencies → build → baseline checks</text><text class="seq-sub" x="45" y="336">MUST log PREPARATION_STATUS: GIT_AUTH / REPOSITORY / ENVIRONMENT / BUILD</text><path class="seq-edge" d="M340 351 h70 v9 h-70"/></g></a><a href="#step-4"><g><text class="seq-num" x="10" y="400">5</text><rect class="seq-bg" x="30" y="382" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="401">Đăng nhập tại URL mtm-game-server được mtm-player cung cấp</text><text class="seq-sub" x="45" y="419">INPUT: username + password từ mtm-player; OUTPUT: đăng nhập thành công</text><line class="seq-edge" x1="340" y1="436" x2="620" y2="436"/></g></a><a href="#step-5"><g><text class="seq-num" x="10" y="483">6</text><rect class="seq-bg" x="30" y="465" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="484">Truy cập https://ai-fest-five.vercel.app/match/ABCD1234</text><text class="seq-sub" x="45" y="502">INPUT: matchId từ mtm-player; OUTPUT: trang đúng trận, đội, repository và backlog</text><line class="seq-edge" x1="340" y1="519" x2="620" y2="519"/></g></a><a href="#step-6"><g><text class="seq-num" x="10" y="566">7</text><rect class="seq-bg" x="30" y="548" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="567">MUST: MATCH_LOGIN completed + ENVIRONMENT_READY</text><text class="seq-sub" x="45" y="585">LOG: requestId, repo, revision, build=PASS, matchLogin=PASS</text><line class="seq-edge" x1="340" y1="602" x2="1080" y2="602"/></g></a><a href="#step-6"><g><text class="seq-num" x="10" y="649">8</text><rect class="seq-bg" x="30" y="631" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="650">Trả kết quả môi trường đã sẵn sàng</text><text class="seq-sub" x="45" y="668">OUTPUT: status=ENVIRONMENT_READY, requestId, repository, revision, build, matchLogin</text><line class="seq-edge" x1="340" y1="685" x2="95" y2="685"/></g></a><a href="#step-7"><g><text class="seq-num" x="10" y="732">9</text><rect class="seq-bg" x="30" y="714" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="733">mtm-player gửi Preparation Complete</text><text class="seq-sub" x="45" y="751">OUTPUT: PREPARED; mtm-player chờ trạng thái chính thức IN_PROGRESS</text><line class="seq-edge" x1="95" y1="768" x2="620" y2="768"/></g></a><a href="#step-8"><g><text class="seq-num" x="10" y="815">10</text><rect class="seq-bg" x="30" y="797" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="816">mtm-player cho phép bắt đầu làm backlog</text><text class="seq-sub" x="45" y="834">INPUT: bearer key + length/hash, API scopes/origins, paths, prepared revision</text><line class="seq-edge" x1="95" y1="851" x2="340" y2="851"/></g></a><a href="#step-9"><g><text class="seq-num" x="10" y="898">11</text><rect class="seq-bg" x="30" y="880" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="899">Đọc trang /match/ABCD1234 sau khi đăng nhập</text><text class="seq-sub" x="45" y="917">OUTPUT: backlog hiện tại và hướng dẫn thao tác do mtm-game-server hiển thị</text><line class="seq-edge" x1="340" y1="934" x2="620" y2="934"/></g></a><a href="#step-9"><g><text class="seq-num" x="10" y="981">12</text><rect class="seq-bg" x="30" y="963" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="982">MUST: BACKLOG_SYNC completed; DISCOVERED từng item</text><text class="seq-sub" x="45" y="1000">LOG: backlogId, title, status=DISCOVERED, revision=null, receiptId=null</text><line class="seq-edge" x1="340" y1="1017" x2="1080" y2="1017"/></g></a><a href="#step-10"><g><text class="seq-num" x="10" y="1064">13</text><rect class="seq-bg" x="30" y="1046" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1065">POST /api/v1/matches/&lt;UUID&gt;/backlogs/start</text><text class="seq-sub" x="45" y="1083">BODY: {backlogItemKey:&quot;TASK-01&quot;}; OUTPUT: template nguồn/scenarios; Team Orchestrator tạo answers/&lt;ID&gt;/submit.json và evidence/</text><line class="seq-edge" x1="340" y1="1100" x2="620" y2="1100"/></g></a><a href="#step-11"><g><text class="seq-num" x="10" y="1147">14</text><rect class="seq-bg" x="30" y="1129" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1148">MUST: BACKLOG_STATUS IN_PROGRESS; BACKLOG_TESTS NOT_RUN</text><text class="seq-sub" x="45" y="1166">Chỉ ghi IN_PROGRESS sau khi Start Work được chấp nhận</text><line class="seq-edge" x1="340" y1="1183" x2="1080" y2="1183"/></g></a><a href="#step-11"><g><text class="seq-num" x="10" y="1230">15</text><rect class="seq-bg" x="30" y="1212" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1231">Implement → chạy test → hoàn thành answer</text><text class="seq-sub" x="45" y="1249">MUST: test RUNNING rồi PASSED/FAILED và required/executed/passed/failed/skipped</text><path class="seq-edge" d="M340 1264 h70 v9 h-70"/></g></a><a href="#step-12"><g><text class="seq-num" x="10" y="1313">16</text><rect class="seq-bg" x="30" y="1295" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1314">Commit và push lên đúng branch</text><text class="seq-sub" x="45" y="1332">OUTPUT: full pushed Git SHA, source/tests/evidence/answer cùng commit</text><line class="seq-edge" x1="340" y1="1349" x2="880" y2="1349"/></g></a><a href="#step-13"><g><text class="seq-num" x="10" y="1396">17</text><rect class="seq-bg" x="30" y="1378" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1397">POST /api/v1/matches/&lt;UUID&gt;/submissions</text><text class="seq-sub" x="45" y="1415">BODY: clientSubmissionId, backlogItemKey, gitRevision, answer; HEADER: Idempotency-Key</text><line class="seq-edge" x1="340" y1="1432" x2="620" y2="1432"/></g></a><a href="#step-14"><g><text class="seq-num" x="10" y="1479">18</text><rect class="seq-bg" x="30" y="1461" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1480">Server trả receipt hoặc lỗi</text><text class="seq-sub" x="45" y="1498">OUTPUT ví dụ: receiptId + status=RECEIVED; không đồng nghĩa đã chấm đạt</text><line class="seq-edge" x1="620" y1="1515" x2="340" y2="1515"/></g></a><a href="#step-14"><g><text class="seq-num" x="10" y="1562">19</text><rect class="seq-bg" x="30" y="1544" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1563">MUST: BACKLOG_STATUS SUBMITTED</text><text class="seq-sub" x="45" y="1581">LOG: full revision + official receiptId; refresh rồi lặp lại backlog tiếp theo</text><line class="seq-edge" x1="340" y1="1598" x2="1080" y2="1598"/></g></a><a href="#step-16"><g><text class="seq-num" x="10" y="1645">20</text><rect class="seq-bg" x="30" y="1627" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1646">mtm-player báo pause hoặc trận đã kết thúc</text><text class="seq-sub" x="45" y="1664">INPUT: sessionId, matchId, matchStatus=PAUSED / FINISHED / CANCELLED</text><line class="seq-edge" x1="95" y1="1681" x2="340" y2="1681"/></g></a><a href="#step-16"><g><text class="seq-num" x="10" y="1728">21</text><rect class="seq-bg" x="30" y="1710" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1729">Dừng API, Git, workers, polling; giữ source/evidence</text><text class="seq-sub" x="45" y="1747">Nếu kết thúc: log ORCHESTRATOR_ENDED; nếu pause: đợi mtm-player cho resume</text><path class="seq-edge" d="M340 1762 h70 v9 h-70"/></g></a><a href="#step-17"><g><text class="seq-num" x="10" y="1811">22</text><rect class="seq-bg" x="30" y="1793" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1812">Nếu được resume: mtm-player tạo Team Orchestrator Agent thay thế</text><text class="seq-sub" x="45" y="1830">INPUT: access mới, paths, repository, restartAttempt, reason, prepared revision</text><line class="seq-edge" x1="95" y1="1847" x2="340" y2="1847"/></g></a><a href="#step-17"><g><text class="seq-num" x="10" y="1894">23</text><rect class="seq-bg" x="30" y="1876" width="1150" height="66" rx="8"/><text class="seq-label" x="45" y="1895">MUST: ORCHESTRATOR_RESTARTED</text><text class="seq-sub" x="45" y="1913">Đối soát log/Git/receipt; không lặp lại submission đã được chấp nhận</text><line class="seq-edge" x1="340" y1="1930" x2="1080" y2="1930"/></g></a></svg><p><strong>MUST:</strong> ghi log vào <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code>. Với match ví dụ: <code>ABCD1234.progress.ndjson</code>. Khi mtm-player cung cấp <code>progressLogFile</code>, MUST dùng đúng đường dẫn đó; mỗi event là một JSON trên một dòng, append và không ghi đè.</p></div><h3>Hướng dẫn thực hiện từng bước</h3><article class="step" id="step-1"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: nhận đầu vào</span><span class="owner-tag owner-player">mtm-player: cung cấp đầu vào</span></div><h3>1. Nhận thông tin và khởi tạo</h3><p>Team Orchestrator Agent nhận session/team/match, repository, quyền đọc Git, account/password, allowed origins và model policy. Đọc workspace AGENTS.md. Team Orchestrator Agent không có bearer key trong bước này.</p><details><summary>Input đầy đủ — chuẩn bị</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;GIT_AUTH&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Quyền Git với repository được giao đã xác minh.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;REPOSITORY&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Đã checkout đúng repository, branch, folder và revision.&quot;}</code></pre></div></article><article class="step" id="step-3"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: setup environment và build</span></div><h3>3. Environment Setup</h3><p>Team Orchestrator Agent kiểm tra Git, Node.js/npm hoặc toolchain mà source thực sự yêu cầu; cài dependencies khóa phiên bản, chạy baseline tests và build. MUST append PREPARATION_STATUS stage ENVIRONMENT và BUILD khi bắt đầu/kết thúc. Chỉ báo COMPLETED khi từng kiểm tra thật sự đạt; lỗi phải báo FAILED/BLOCKED và không gửi ENVIRONMENT_READY.</p><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;ENVIRONMENT&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Toolchain và dependencies cần thiết đã sẵn sàng.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;PREPARATION_STATUS&quot;,&quot;stage&quot;:&quot;BUILD&quot;,&quot;status&quot;:&quot;COMPLETED&quot;,&quot;summary&quot;:&quot;Baseline checks và build đã đạt.&quot;}</code></pre></div></article><article class="step" id="step-4"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: đăng nhập</span><span class="owner-tag owner-server">mtm-game-server: xác thực</span></div><h3>4. Đăng nhập mtm-game-server</h3><p>Mở URL mtm-game-server do mtm-player cung cấp. Đăng nhập bằng username và password trong đầu vào của mtm-player. Sau khi đăng nhập thành công, chủ động mở trang đúng matchId; không dựa vào trang redirect mặc định.</p><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="text">URL ví dụ: https://ai-fest-five.vercel.app/
Username: giá trị username do mtm-player cung cấp
Password: giá trị password do mtm-player cung cấp</code></pre></div></article><article class="step" id="step-5"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: đọc và kiểm tra</span><span class="owner-tag owner-server">mtm-game-server: hiển thị thông tin</span></div><h3>5. Đọc đúng match và xác nhận assignment</h3><p>Sau khi đăng nhập, truy cập URL /match/&lt;matchId&gt; trên cùng mtm-game-server. Ví dụ matchId ABCD1234 tương ứng https://ai-fest-five.vercel.app/match/ABCD1234. Đọc thông tin trận, đội, repository/branch/folder và backlog trên trang. Kiểm tra chúng khớp đầu vào mtm-player. Trong preparation chỉ xác nhận quyền truy cập và assignment, chưa bắt đầu làm backlog.</p><aside>MUST mở đúng trang theo matchId; /match chung không đủ để xác định đề. Output là thông tin hiển thị của trận và danh sách backlog được phép xem, không yêu cầu một response API nội bộ cụ thể.</aside></article><article class="step" id="step-6"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: ghi readiness log</span><span class="owner-tag owner-player">mtm-player: đọc và validate log</span></div><h3>6. Ghi log readiness</h3><p>MUST ghi MATCH_LOGIN completed rồi append event ENVIRONMENT_READY vào đúng progressLogFile qua progress writer/helper của đội. mtm-player tự đọc file log khi polling, validate event và xử lý các bước cần thiết với mtm-game-server. Team Orchestrator Agent không gửi JSON này tới một API của mtm-player và không cần parent task chuyển tiếp. Final response trong CLI chỉ có thể nhắc lại kết quả để người xem đọc; riêng final response không thay thế log bắt buộc.</p><details class="must-details"><summary>JSON append xuống progress.ndjson — MUST; đây là kênh gửi cho mtm-player</summary><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;ENVIRONMENT_READY&quot;,&quot;requestId&quot;:&quot;prepare-example&quot;,&quot;repository&quot;:{&quot;url&quot;:&quot;https://github.com/example/repo.git&quot;,&quot;branch&quot;:&quot;main&quot;,&quot;folder&quot;:&quot;ABCD1234&quot;},&quot;revision&quot;:&quot;0123456789abcdef0123456789abcdef01234567&quot;,&quot;build&quot;:&quot;PASS&quot;,&quot;matchLogin&quot;:&quot;PASS&quot;}</code></pre></div></details><details><summary>Thông tin mtm-player đọc và validate từ log</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

  &quot;matchLogin&quot;: &quot;PASS&quot;
}</code></pre></div></details><details><summary>mtm-player xử lý readiness như thế nào</summary><p>mtm-player xác minh repository, revision, build và trạng thái đăng nhập từ progress log. Khi dữ liệu hợp lệ, mtm-player tự thông báo cho mtm-game-server rằng môi trường đã sẵn sàng, lưu kết quả và cập nhật milestone chuẩn bị. Team Orchestrator Agent chỉ cần ghi đúng log; không gọi thay thao tác thuộc mtm-player.</p></details><aside>Luồng: Team Orchestrator Agent → helper append ENVIRONMENT_READY → progressLogFile → mtm-player polling/validate → mtm-player xử lý readiness với mtm-game-server. Nếu chưa ghi log thành công thì mtm-player chưa nhận readiness, dù transcript đã báo chuẩn bị xong.</aside></article><article class="step" id="step-7"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-player">mtm-player: gửi Preparation Complete</span><span class="owner-tag owner-server">mtm-game-server: xác nhận PREPARED</span></div><h3>7. Chờ mtm-player chấp nhận preparation</h3><p>mtm-player tự xác minh readiness, thông báo trạng thái chuẩn bị lên mtm-game-server và chờ hệ thống chấp nhận. Team Orchestrator Agent không gọi thay thao tác này và không tự ghi milestone do mtm-player quản lý. Chỉ bắt đầu làm backlog khi mtm-player gửi đầu vào game đang hoạt động.</p><aside>Không có operator command riêng để start backlog sau khi preparation đã hoàn tất.</aside></article><article class="step" id="step-8"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-player">mtm-player: gửi đầu vào game</span><span class="owner-tag owner-orch">Team Orchestrator Agent: nhận và kiểm tra</span></div><h3>8. Nhận access cho active game</h3><p>Kiểm tra environmentRevision, bearer UTF-8 length/SHA-256, origins, scopes, paths và hostAuthorization. Thông tin repo/account trong preparation được giữ bởi helper; start không lặp lại chúng.</p><details><summary>Input đầy đủ — bắt đầu game; key mẫu là giả</summary><div class= ionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_STATUS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;title&quot;:&quot;Sửa tìm kiếm khách hàng&quot;,&quot;status&quot;:&quot;DISCOVERED&quot;,&quot;summary&quot;:&quot;Trạng thái công việc được cập nhật.&quot;,&quot;revision&quot;:null,&quot;receiptId&quot;:null}</code></pre></div></article><article class="step" id="step-10"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: gọi Start Work</span><span class="owner-tag owner-server">mtm-game-server: chấp nhận và trả đề</span></div><h3>10. Start Work trước khi sửa</h3><p>Team Orchestrator Agent gọi API POST /api/v1/matches/&lt;match.id UUID&gt;/backlogs/start lên mtm-game-server để bắt đầu làm một backlog. Gửi team bearer key trong Authorization và backlogItemKey của backlog được chọn trong JSON body. mtm-game-server xác nhận Start Work và trả template/scenarios cần thực hiện. Chỉ sau khi mtm-game-server chấp nhận, Team Orchestrator Agent mới ghi trạng thái IN_PROGRESS vào progress log và bắt đầu sửa source. Header Accept và Content-Type là application/json.</p><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;GAME_MASTER_API&quot;,&quot;operation&quot;:&quot;START_WORK&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;method&quot;:&quot;POST&quot;,&quot;origin&quot;:&quot;https://ai-fest-five.vercel.app&quot;,&quot;path&quot;:&quot;/api/v1/matches/11111111-1111-4111-8111-111111111111/backlogs/start&quot;,&quot;phase&quot;:&quot;SUCCEEDED&quot;,&quot;httpStatus&quot;:200,&quot;requestId&quot;:&quot;req-start&quot;,&quot;summary&quot;:&quot;Đã nhận kết quả mtm-game-server.&quot;}</code></pre></div></article><article class="step" id="step-11"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: implement và test</span></div><p>Trước khi submit, kiểm tra đúng Git revision có <code>&lt;repository.folder&gt;/answers/&lt;backlogId&gt;/submit.json</code> và mọi evidence được tham chiếu trong folder <code>evidence/</code> tương ứng. File nằm tại <code>answers/</code> ở Git root là chưa đúng. Ghi file trên máy dùng <code>matchRoot/answers/…</code>; kiểm tra Git dùng đường dẫn tương đối từ <code>checkoutRoot</code>. Tham chiếu trong JSON vẫn là <code>evidence/&lt;filename&gt;</code>.</p><h3>11. Implement, test và hoàn thành answer</h3><p>Ghi IN_PROGRESS, BACKLOG_TESTS NOT_RUN; sửa source; chạy required scenarios và regression cần thiết. Trong <code>submit.json</code>, đường dẫn evidence là tương đối từ thư mục answer của backlog, ví dụ <code>evidence/TASK-01-TC-01.json</code>; không thêm <code>answers/TASK-01/</code> vào giá trị JSON. Báo RUNNING rồi PASSED/FAILED cùng counts thật. Nếu blocked, ghi BLOCKER_OPENED; khi khắc phục ghi BLOCKER_RESOLVED cùng ID.</p><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_TESTS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;status&quot;:&quot;NOT_RUN&quot;,&quot;required&quot;:2,&quot;executed&quot;:0,&quot;passed&quot;:0,&quot;failed&quot;:0,&quot;skipped&quot;:0,&quot;summary&quot;:&quot;Chưa chạy test.&quot;}</code></pre></div><div class="log-destination"><strong class="must-write">MUST ghi vào file:</strong> <code>&lt;TeamWorkspace&gt;/team-sdlc-pack/logs/&lt;matchId&gt;.progress.ndjson</code><br>Ví dụ: <code>D:/mtm/T01/team-sdlc-pack/logs/ABCD1234.progress.ndjson</code>.<br>Dùng đúng <code>progressLogFile</code> của phiên hiện tại khi được cung cấp. <strong>Nội dung append:</strong> JSON bên dưới + một newline (UTF-8). Không ghi đè file. Thay playerSessionId và các giá trị mẫu bằng dữ liệu thực.</div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="ndjson">{&quot;schemaVersion&quot;:1,&quot;playerSessionId&quot;:&quot;session-example&quot;,&quot;type&quot;:&quot;BACKLOG_TESTS&quot;,&quot;backlogId&quot;:&quot;TASK-01&quot;,&quot;status&quot;:&quot;PASSED&quot;,&quot;required&quot;:2,&quot;executed&quot;:2,&quot;passed&quot;:2,&quot;failed&quot;:0,&quot;skipped&quot;:0,&quot;summary&quot;:&quot;Hai test bắt buộc đã đạt.&quot;}</code></pre></div></article><article class="step" id="step-12"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: commit và push</span></div><h3>12. Commit và push đúng branch</h3><p>Hoàn thành answer theo template. Commit source/tests/evidence/answer cùng nhau; push đúng repo/branch được giao; lấy full SHA 40 hoặc 64 ký tự. Không dùng HEAD mơ hồ cho submit.</p><aside>answer không chứa gitRevision; SHA nằm ở cấp ngoài của submission request.</aside></article><article class="step" id="step-13"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-orch">Team Orchestrator Agent: gửi submission</span><span class="owner-tag owner-server">mtm-game-server: nhận submission</span></div><h3>13. Gửi submission</h3><p>Team Orchestrator Agent gọi API POST /api/v1/matches/&lt;match.id UUID&gt;/submissions lên mtm-game-server để nộp kết quả của backlog đã thực hiện. JSON body gồm clientSubmissionId, backlogItemKey, gitRevision và answer. Gửi team bearer key trong Authorization, dùng JSON headers và Idempotency-Key bằng clientSubmissionId. Team Orchestrator Agent ghi log REQUESTED ngay trước khi gọi và kết quả ngay sau khi nhận response.</p><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

  }
}</code></pre></div><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="http">Authorization: Bearer &lt;runtime team key&gt;
Accept: application/json
Content-Type: application/json
Idempotency-Key: 33333333-3333-4333-8333-333333333333</code></pre></div></article><article class="step" id="step-14"><div class="owner-tags" aria-label="Thành phần chịu trách nhiệm"><span class="owner-tag owner-server">mtm-game-server: trả receipt</span><span class="owner-tag owner-orch">Team Orchestrator Agent: ghi SUBMITTED</span></div><h3>14. Nhận receipt và cập nhật log</h3><p>mtm-game-server trả receiptId và trạng thái tiếp nhận submission (ví dụ RECEIVED) cho Team Orchestrator Agent. Receipt xác nhận server đã nhận bài, chưa phải kết quả chấm điểm. Team Orchestrator Agent MUST ghi BACKLOG_STATUS SUBMITTED vào progress log với full Git SHA và receiptId chính thức để mtm-player hiển thị. HTTP 2xx thiếu acceptance receipt không đủ để báo SUBMITTED.</p><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

an></div><h3>16. Pause, kết thúc và dừng</h3><p>mtm-player gửi session/match/matchStatus. Dừng new API/Git/tool/worker/polling và process pack-owned, giữ source/evidence. Pause không ghi ORCHESTRATOR_ENDED. Game kết thúc: ghi event nếu process còn có thể ghi; không submit thêm.</p><details><summary>Input pause</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

 để né giám sát, tiếp tục làm việc sau stop, hoặc tạo agent ngoài cây được quản lý.</td></tr><tr><td>Đường dẫn submission</td><td>Chỉ coi <code>challenge/&lt;ID&gt;-submit.json</code> là template nguồn; tạo <code>answers/&lt;ID&gt;/submit.json</code> và chỉ lưu evidence dưới <code>answers/&lt;ID&gt;/evidence/</code>.</td><td>Dùng folder template làm destination; commit <code>evidence/</code> ở root hoặc <code>challenge/evidence/</code>; ghi đường dẫn tương đối từ repository vào JSON.</td></tr><tr><td>Telemetry</td><td>Required events đúng milestone/schema; no secrets/raw bodies; receipt và tests phải là thật.</td><td>Báo SUBMITTED không receipt; PASSED không test; giả event để che thao tác.</td></tr><tr><td>Approval/authentication</td><td>Provider request qua mtm-player; giữ agent sống khi pending; báo blocker nếu bị từ chối hoặc không khả dụng; Git authentication do operator xử lý.</td><td>Đội sửa mtm-player app để bypass approval hoặc tự login thay credential ngoài scope.</td></tr></tbody></table></div><aside>Hành động ngoài các guardrail trên có thể được ghi nhận là Suspected Violation và bị xử lý theo luật cuộc thi.</aside><h3>Lỗi thường gặp</h3><ul><li>Cookie expired: reauthenticate session hiện tại và refresh; bearer rejected: báo blocker và chờ authorized recovery.</li><li>Server/request timeout: đừng đổi UUID submission khi chưa rõ outcome.</li><li>Game không có backlog: giữ Team Orchestrator Agent chờ, không trả terminal result.</li><li>Đổi workspace sau cài: rerun installer để cập nhật MCP path; reload provider session.</li></ul></section><section id="section-5"><h2>5. Đóng gói team-pack</h2><h3>Quy tắc tên và identity — MUST</h3><p>Team Orchestrator Agent là vai trò; tên đăng ký bắt buộc là <code>team_orchestrator</code> (underscore), không phải <code>team-orchestrator</code>. Dấu gạch ngang dùng cho đường dẫn file. Các tên sau là quy tắc tương thích hiện tại của mtm-player, không phải tên đội chơi.</p><div class="table-wrap"><table><thead><tr><th>Vị trí</th><th>Giá trị bắt buộc</th></tr></thead><tbody><tr><td>package.json → name</td><td>team-sdlc-pack</td></tr><tr><td>team-runtime.json → name / kind</td><td>team-sdlc-pack / mtm-team-runtime</td></tr><tr><td>entrypoint.rootAgentType</td><td>team_orchestrator</td></tr><tr><td>agents/team-orchestrator.toml → name</td><td>team_orchestrator</td></tr><tr><td>File skill orchestrator (không phải field manifest)</td><td>skills/team-orchestrator/SKILL.md</td></tr><tr><td>File identity trong package</td><td>team-pack-info.json</td></tr><tr><td>File identity sau cài</td><td>&lt;TeamWorkspace&gt;/.mtm/team-pack-info.json; bản payload nằm trong team-sdlc-pack/runtime/</td></tr></tbody></table></div><p>Tên folder source, tên ZIP và đường dẫn TeamWorkspace có thể đặt theo đội (ví dụ HNKSUPER); MUST NOT đổi package name thành tên đội. Không cần tự đặt tên session runtime; mtm-player quản lý session. Hai đội có cùng package name là bình thường, nhưng MUST dùng teamId của chính đội đã đăng ký trên mtm-game-server.</p><h4>team-pack-info.json — đúng 4 field, không thêm field</h4><ul><li><code>schemaVersion</code>: số nguyên 1.</li><li><code>version</code>: chuỗi dạng X.Y.Z; MUST giống version trong package.json và team-runtime.json.</li><li><code>teamId</code>: mã đội đăng ký, không phải UUID của bản ghi team. Dài 1–128 ký tự; bắt đầu bằng chữ hoặc số; phần còn lại chỉ chữ, số, underscore, dấu chấm, dấu hai chấm hoặc gạch ngang. MUST khớp đội init; mtm-player so sánh ID không phân biệt hoa/thường.</li><li><code>teamName</code>: tên đội; 1–160 ký tự, không khoảng trắng ở đầu/cuối, không newline hoặc NUL. MUST điền tên đội thực, không giữ tên mẫu.</li></ul><p>Ví dụ HNKSUPER dùng teamId <code>HNKSUPER</code>, teamName <code>HNK Super</code>; HNK dùng identity riêng. Installer MUST giữ đồng bộ bản identity trong payload và .mtm. Đổi identity ở một bản duy nhất có thể bị mtm-player báo registration/payload không khớp. JSON mẫu đầy đủ ở bên dưới.</p><p>Bản tối thiểu dùng Node built-ins, không npm dependencies hoặc install lifecycle hooks. mtm-player hiện yêu cầu bốn profile provider: <code>team_orchestrator</code>, <code>team_repo_scout</code>, <code>team_feature_worker</code>, <code>team_quality_checker</code>. Đây là profile registrations; Team Orchestrator Agent chỉ được spawn agent phụ bằng cơ chế native của provider trong cùng CLI session, và chỉ khi việc tách vai trò hữu ích. Các vai trò ở mục 2 có thể do profile phụ hoặc Team Orchestrator Agent đảm nhiệm.</p><details><summary>package.json — files array phải giữ đúng thứ tự</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{
  &quot;name&quot;: &quot;team-sdlc-pack&quot;,

    &quot;src/&quot;,
    &quot;README.md&quot;,
    &quot;team-pack-info.json&quot;,
    &quot;team-runtime.json&quot;
  ]
}</code></pre></div></details><details><summary>team-pack-info.json — thay ID/name/version trước build</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{

}</code></pre></div></details><details><summary>team-runtime.json — manifest đầy đủ cho bản tối thiểu</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="json">{
  &quot;schemaVersion&quot;: 1,
  &quot;kind&quot;: &quot;mtm-team-runtime&quot;,
  &quot;name&quot;: &quot;team-sdlc-pack&quot;,

    &quot;rootAgentType&quot;: &quot;team_orchestrator&quot;
  }
}</code></pre></div></details><details><summary>Team Orchestrator Agent profile gợi ý; không pin model/permission override</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="toml">name = &quot;team_orchestrator&quot;
description = &quot;MTM contestant Team Orchestrator and project manager.&quot;
developer_instructions = &quot;&quot;&quot;
Read .agents/skills/team-orchestrator/SKILL.md and obey all mtm-player lifecycle instructions.
Coordinate the Business Analyst, Developer, Cyber Security, and Tester responsibilities.
Spawn subagents only with the provider-native mechanism in this same CLI session.
Use the registered team_repo_scout, team_feature_worker, and team_quality_checker profiles when useful.
Do not launch another Codex CLI, Claude Code CLI, app-server, or independent CLI process for match work.
Keep credentials in MCP Helper memory; append required events to the exact progressLogFile.
Own integration, Git actions, submissions, receipts, and final decisions.
Honor pause/end immediately; do not self-respawn or resume.
&quot;&quot;&quot;</code></pre></div></details><details><summary>config/codex.toml — installer chỉ expand path này</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="toml">[mcp_servers.mtm_minimal]
command = &quot;node&quot;
args = [&quot;../team-sdlc-pack/runtime/bin/runtime-server.mjs&quot;]
startup_timeout_sec = 15
tool_timeout_sec = 120</code></pre></div></details><p>Các profile phụ tương ứng tên đăng ký trên. <code>team_repo_scout</code> đảm nhiệm BA và Cyber Security; <code>team_feature_worker</code> đảm nhiệm Developer; <code>team_quality_checker</code> đảm nhiệm Tester. Mỗi profile có thể không được spawn trong một backlog cụ thể. Manifest phải có đúng các field trong ví dụ bên dưới. Player từ chối field thừa ở cấp gốc hoặc entrypoint. Đặt hướng dẫn trong agent profile và skill; không thêm capabilities, supportedMessages, isolation hoặc hostRequirements vào manifest. Team Orchestrator Agent vẫn phải tuân thủ allowedModels từ đầu vào.</p><h3>Installer và checker cần làm gì</h3><ol><li>Nhận TeamWorkspace tuyệt đối, resolve path, chặn symlink/junction và target unsafe.</li><li>Kiểm tra package/version/checksum, đúng Team ID/name và mọi file khai báo tồn tại. Tạo matches/team-sdlc-pack nếu chưa có.</li><li>Copy package.json và các package.files entries vào runtime; copy profile/skill/manifest/info tới layout ở phần 2.</li><li>Expand đúng MCP args thành path tuyệt đối trong runtime, JSON-quote path/TOML dùng forward slash; giữ source package portable. mtm-player so sánh exact registration bytes, chỉ chấp nhận expansion này.</li><li>Cài lại bản giống nhau phải idempotent; upgrade chỉ thay files pack-owned, không xoá checkout của các match hoặc logs hoặc đè config không thuộc pack.</li><li>Checker read-only xác nhận registrations/payload parity, identity/version, schema/manifest và returned READY; nonzero khi fail.</li><li>Đóng ZIP source đầy đủ gồm installer/checker và checksum. Nếu dùng npm pack tgz, outer installer phải có giải nén/verify; không đưa tgz cho installer chỉ nhận thư mục.</li></ol><details><summary>Wrapper install.ps1 tối thiểu</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="powershell">param([Parameter(Mandatory=$true)][string]$TeamWorkspace)
$ErrorActionPreference = 'Stop'
&amp; node (Join-Path $PSScriptRoot 'scripts/install.mjs') --team-workspace $TeamWorkspace
if ($LASTEXITCODE -ne 0) { throw 'TEAM_PACK_INSTALL_FAILED' }</code></pre></div></details><details><summary>Lệnh dành cho operator</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="powershell">powershell -NoProfile -ExecutionPolicy Bypass -File .\minimal-pack\install.ps1 -TeamWorkspace &quot;D:\mtm\T01&quot;
node .\minimal-pack\scripts\check-distribution.mjs --team-workspace &quot;D:\mtm\T01&quot;
Compress-Archive -LiteralPath .\minimal-pack -DestinationPath .\team-pack-T01-1.0.0.zip
Get-FileHash -LiteralPath .\team-pack-T01-1.0.0.zip -Algorithm SHA256</code></pre></div></details><p>Operator chọn workspace và Load team pack trong mtm-player UI, kiểm tra đúng identity và init. Team runtime không gọi private mtm-player API để tự init. Xác minh MCP initialize/tools/list và configure/report trong một provider context mới; file đã cài không tự chứng minh tool đã được host load.</p><h3>Wire markers cho người implement parser</h3><p>Sequence dùng tên thao tác. Khi code parser, marker thực tế phải khớp bảng sau; parse JSON line sau marker và model-policy suffix riêng, không parse toàn bộ prompt như JSON.</p><div class="table-wrap"><table><thead><tr><th>Thao tác</th><th>Marker đầu vào thực tế</th><th>descriptor.type</th></tr></thead><tbody><tr><td>Chuẩn bị</td><td>PREPARE_GAME_V2</td><td>PREPARE_GAME</td></tr><tr><td>Bắt đầu backlog</td><td>START_GAME_V4</td><td>START_GAME</td></tr><tr><td>Resume preparation</td><td>RESUME_PREPARATION_V1</td><td>RESUME_PREPARATION</td></tr><tr><td>Resume game</td><td>RESUME_GAME_V1</td><td>RESUME_GAME</td></tr><tr><td>Pause</td><td>MATCH_PAUSED_V1</td><td>MATCH_PAUSED</td></tr><tr><td>End</td><td>MATCH_ENDED_V1</td><td>MATCH_ENDED</td></tr><tr><td>Model rule</td><td>MTM_MODEL_POLICY_V1</td><td>schemaVersion, orchestratorModel, allowedModels, enforcement, catalogSource, catalogFetchedAt, instruction</td></tr></tbody></table></div><h3>Smoke test trước delivery</h3><p>Dùng mock server với dữ liệu giả trong HTML này: login/cookie, đúng match identity, empty/new backlog, Start Work/template, submission receipt, timeout retry cùng UUID, expired auth, append failure, pause/end và resume. Loopback HTTP chỉ cho mock-test mode; production dùng allowed HTTPS origin. Test final ZIP trên workspace sạch và cài lại; source cũ phải được giữ. Không đưa credentials, real match logs, cache hay hidden files của hệ thống cuộc thi vào archive.</p><details><summary>Prompt cho một session mới chỉ có tài liệu này</summary><div class="code"><button class="copy" type="button">Sao chép</button><pre><code data-lang="text">Dựa hoàn toàn vào HTML guide này, tạo minimal team-pack cho Team ID &lt;ID&gt;, tên &lt;Name&gt;, version 1.0.0.
Một Codex orchestrator, sử dụng provider-native subagents trong cùng session khi hữu ích; không launch CLI thứ hai.
Tạo đầy đủ files, manifest, profiles, skills, JSON progress schema từ guide, installer/checker và mock tests.
Implement lifecycle input/output ở phần 3, API cookie/bearer/idempotency và logs MUST.
Không import source reference pack hay mtm-player internals; không gọi mtm-player private APIs.
Verify manifest/registration parity, MCP handshake, readiness, Start/Submit, retry, stop/resume.
Build ZIP/checksum, README cài đặt. Dùng public template thực từ server; nếu response không khớp, báo blocker, không đoán.
Không hard-code credentials/repository/models thật.</code></pre></div></details></section><footer class="smallprint">Bản tiếng Việt · Schema và metadata snapshot lấy từ source hiện tại. Ví dụ API không phải dữ liệu production. Kiến trúc nội bộ là gợi ý; trách nhiệm tương thích và guardrail thuộc đội.</footer></main></div></template><script>
const root=document.getElementById('guide-root');
let observer;
function bindGuide(){
  document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>renderGuide(button.dataset.language)));
  document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{const text=button.nextElementSibling.textContent;try{await navigator.clipboard.writeText(text);button.textContent=document.documentElement.lang==='vi'?'Đã sao chép':'Copied';}catch{const range=document.createRange();range.selectNodeContents(button.nextElementSibling);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);button.textContent=document.documentElement.lang==='vi'?'Đã chọn — Ctrl+C':'Selected — Ctrl+C';}setTimeout(()=>button.textContent=document.documentElement.lang==='vi'?'Sao chép':'Copy',2200);}));
  const links=[...root.querySelectorAll('nav[aria-label="Mục lục"] a,nav[aria-label="Contents"] a')];
  observer?.disconnect();
  observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)links.forEach(link=>link.classList.toggle('active',link.hash==='#'+entry.target.id));},{rootMargin:'-10% 0px -65% 0px'});
  root.querySelectorAll('main>section').forEach(section=>observer.observe(section));
}
function renderGuide(lang){
  const selected=lang==='vi'?'vi':'en';
  document.documentElement.lang=selected;
  root.innerHTML=document.getElementById('guide-'+selected).innerHTML;
  bindGuide();
  if(location.hash)requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());
}
renderGuide('en');
</script></body></html>
